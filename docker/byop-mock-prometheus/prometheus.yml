---
# Mock external Prometheus config for BYOP molecule tests.
# Mirrors the BYOP customer prerequisites: promoted Confluent attributes, an out-of-order
# window, and C3's recording rules. No alerting or trigger rules (alerts are off in BYOP).
global:
  scrape_interval: 60s
  evaluation_interval: 60s

rule_files:
  - '/etc/prometheus/recording_rules-generated.yml'

scrape_configs: []

# Flatten the Confluent resource attributes into per-series labels that C3 queries.
otlp:
  promote_resource_attributes:
    - "host.hostname"
    - "java.version"
    - "kafka.broker.id"
    - "kafka.cluster.id"
    - "kafka.version"
    - "type"
    - "kafka.process.roles"
    - "kafka.process.roles.broker"
    - "kafka.process.roles.controller"
    - "kafka.kafka.node.id"
    - "kafka.broker.rack"

# Absorb retries and network delays on the pushed samples.
storage:
  tsdb:
    out_of_order_time_window: 10m
