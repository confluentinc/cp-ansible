---
# Basic auth over TLS. Used by the greenfield-basic and the RBAC/FIPS external scenarios.
tls_server_config:
  cert_file: /etc/prometheus/certs/server.crt
  key_file: /etc/prometheus/certs/server.key

# The bcrypt hash below must be of the password the molecule scenario sets in
# control_center_next_gen_dependency_prometheus_basic_users.admin.password.
# Generate it with:  htpasswd -nBC 10 "" | tr -d ':\n'
basic_auth_users:
  c3: "$2y$10$gyQAl.kPXp21GvDIKx/1y.HZqkBRx4LzVSab4.nc7lTfmqkG1aV/u"
