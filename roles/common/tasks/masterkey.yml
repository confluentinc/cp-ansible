---
- name: Create Passphrase File
  tags: masterkey
  shell: "openssl rand -base64 14 > '{{ deploy_tmp_dir }}/passphrase.txt'"
  changed_when: true
  diff: "{{ not mask_sensitive_diff|bool }}"

- name: Generate Master Encryption Key and File
  tags: masterkey
  shell: |
    {{ confluent_cli_path }} secret master-key generate \
      --local-secrets-file '{{ deploy_tmp_dir }}/security.properties' \
      --passphrase '@{{ deploy_tmp_dir }}/passphrase.txt' | awk '/Master/{print $5}'
  args:
    executable: "{{ shell_executable }}"
  register: masterkey
  changed_when: true
  diff: "{{ not mask_sensitive_diff|bool }}"

- name: Write Master Key to File
  tags: masterkey
  copy:
    content: "{{ masterkey.stdout }}"
    dest: "{{ deploy_tmp_dir }}/masterkey"
    mode: '640'
  diff: "{{ not mask_sensitive_diff|bool }}"

- name: Copy Security File Back to Ansible Host
  tags: masterkey
  fetch:
    src: "{{ deploy_tmp_dir }}/security.properties"
    dest: "{{secrets_protection_security_file}}"
    flat: true
  diff: "{{ not mask_sensitive_diff|bool }}"

- name: Copy Master Key Back to Ansible Host
  tags: masterkey
  fetch:
    src: "{{ deploy_tmp_dir }}/masterkey"
    dest: "generated_ssl_files/"
    flat: true
  diff: "{{ not mask_sensitive_diff|bool }}"

- name: Remove Set Up Files
  tags: masterkey
  file:
    path: "{{ deploy_tmp_dir }}/{{item}}"
    state: absent
  loop:
    - passphrase.txt
    - security.properties
    - masterkey
