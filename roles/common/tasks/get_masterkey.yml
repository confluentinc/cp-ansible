---
# Reads back a previously-persisted CONFLUENT_SECURITY_MASTER_KEY: the rootless EnvironmentFile
# under rootless_enabled, or root's override.conf otherwise.

- name: Determine the master key source file (rootless env file or root override.conf)
  set_fact:
    masterkey_source_file: "{{ (rootless_lifecycle_bin_dir ~ '/' ~ rootless_component_name ~ '.env') if (rootless_enabled | bool) else systemd_override_path }}"

- name: Check if master key source file exists
  stat:
    path: "{{ masterkey_source_file }}"
  register: override_stat

- name: Log when master key source file is not found
  debug:
    msg: "{{ masterkey_source_file }} not found — skipping master key extraction"
  when: not (override_stat.stat.exists | default(false))

- name: Load master key source file
  slurp:
    src: "{{ masterkey_source_file }}"
  register: slurped_override
  when: override_stat.stat.exists | default(false)
  no_log: "{{mask_secrets|bool}}"

- name: Extract CONFLUENT_SECURITY_MASTER_KEY from master key source file
  set_fact:
    existing_masterkey: "{{ (slurped_override.content | b64decode).split('\n') |
      select('match', '.*CONFLUENT_SECURITY_MASTER_KEY=.*') |
      list | first | regex_search(masterkey_extraction_pattern, '\\1') | first }}"
  vars:
    # Root's override.conf quotes the value (ends at '"'); rootless's EnvironmentFile doesn't (EOL).
    masterkey_extraction_pattern: "{{ 'CONFLUENT_SECURITY_MASTER_KEY=(.+)\"' if not (rootless_enabled | bool) else 'CONFLUENT_SECURITY_MASTER_KEY=(.+)$' }}"
  when:
    - slurped_override is not skipped
    - slurped_override.content | default('') | b64decode is search('CONFLUENT_SECURITY_MASTER_KEY')
  no_log: "{{mask_secrets|bool}}"
