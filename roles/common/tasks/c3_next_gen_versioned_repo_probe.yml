---
# C3 Next Gen 2.7+ publishes packages under a version-isolated <major.minor>/ subdir (e.g. rpm/2.7/,
# deb/2.7/, archive/2.7/); legacy lines stay flat. Probe the versioned dir and use it when it exists
# (HTTP 200), else fall back to the flat dir (404). Any other status fails the task - we never guess
# the layout. Decided by the bucket, not a hardcoded version boundary (mirrors muckrake/ironbank).
#
# Inputs (set via include vars):
#   c3_next_gen_probe_package_type : "rpm" | "deb" | "archive" (for messaging only)
#   c3_next_gen_probe_url          : the versioned dir URL to probe, e.g.
#                                    "{{ ...independent_repository_baseurl }}/rpm/{{ ...repo_version }}/"
- name: "Probe C3 Next Gen version-isolated {{ c3_next_gen_probe_package_type }} location"
  ansible.builtin.uri:
    url: "{{ c3_next_gen_probe_url }}"
    method: GET
    status_code:
      - 200
      - 404
  register: confluent_control_center_next_gen_versioned_probe

- name: "Use version-isolated C3 Next Gen {{ c3_next_gen_probe_package_type }} location when present"
  ansible.builtin.set_fact:
    confluent_control_center_next_gen_version_segment: "/{{ confluent_control_center_next_gen_repo_version }}"
  when: confluent_control_center_next_gen_versioned_probe.status == 200
