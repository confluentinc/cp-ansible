---
# Independent components (C3 Next Gen, USM Agent) publish rpm/deb/archive under a version-isolated
# <major.minor>/ subdir on newer lines (e.g. rpm/2.7/); legacy lines stay flat (rpm/). Probe the
# versioned dir: HTTP 200 -> use it (segment = "/<major.minor>"); 404 -> flat (segment = ""); any
# other status -> fail hard. The layout is decided by the bucket, not a hardcoded version boundary
# (mirrors the muckrake / ironbank-tools probe).
#
# Inputs (passed via include vars):
#   versioned_probe_component   : label used only in task messages, e.g. "C3 Next Gen rpm"
#   versioned_probe_url         : the versioned dir URL to probe
#   versioned_probe_minor       : the <major.minor> to place in the segment
#   versioned_probe_segment_var : name of the per-component segment fact to set
- name: "Probe {{ versioned_probe_component }} version-isolated location"
  ansible.builtin.uri:
    url: "{{ versioned_probe_url }}"
    method: GET
    status_code:
      - 200
      - 404
  register: confluent_versioned_layout_probe

# Set explicitly in both cases so a 404 resets any segment left over from an earlier probe/run.
- name: "Set {{ versioned_probe_component }} version-isolated path segment"
  ansible.builtin.set_fact:
    "{{ versioned_probe_segment_var }}": "{{ ('/' + versioned_probe_minor) if confluent_versioned_layout_probe.status == 200 else '' }}"
