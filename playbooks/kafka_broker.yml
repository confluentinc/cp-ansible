---
- name: Kafka Broker Status Finding
  hosts: kafka_broker
  gather_facts: false
  tags: kafka_broker
  environment: "{{ proxy_env }}"
  tasks:
    - import_role:
        name: variables

    - name: Populate service facts
      service_facts:
      when: not (rootless_lifecycle_enabled | bool)

    - name: Query rootless service state (systemd --user, read-only)
      include_role:
        name: common
        tasks_from: rootless_service_state.yml
      vars:
        rootless_component_name: kafka_broker
      when: rootless_lifecycle_enabled | bool

    - name: Determine Installation Pattern - Parallel or Serial
      set_fact:
        install_pattern: "{{ 'parallel' if service_state != 'running' or kafka_broker_deployment_strategy == 'parallel' else 'serial' }}"
      vars:
        service_state: >-
          {{ rootless_service_state | default('unknown')
             if rootless_lifecycle_enabled | bool
             else (ansible_facts.services[kafka_broker_service_name + '.service'].state | default('unknown')) }}

    - name: Group Hosts by Installation Pattern
      group_by:
        key: kafka_broker_{{install_pattern}}
      changed_when: false

- name: Kafka Broker Parallel Provisioning
  hosts: kafka_broker_parallel
  gather_facts: false
  tags: kafka_broker
  environment: "{{ proxy_env }}"
  tasks:
    - import_role:
        name: kafka_broker

# The motivation for rolling the "active controller" last doesn't apply to KRaft because failover (i.e. election of a new leader/active controller) is very fast
- name: Kafka Broker Serial Provisioning
  hosts: kafka_broker_serial
  gather_facts: false
  serial: 1
  tags: kafka_broker
  environment: "{{ proxy_env }}"
  tasks:
    - import_role:
        name: kafka_broker
      when: kraft_enabled|bool

- name: Kafka Broker Serial Ordering
  hosts: kafka_broker_serial
  gather_facts: false
  tags: kafka_broker
  environment: "{{ proxy_env }}"
  tasks:
    - import_role:
        name: kafka_broker
        tasks_from: dynamic_groups.yml
      when: not kraft_enabled|bool

- name: Kafka Broker Non Controllers Provisioning
  hosts: kafka_broker_non_controller
  serial: 1
  any_errors_fatal: true
  gather_facts: false
  tags: kafka_broker
  environment: "{{ proxy_env }}"
  tasks:
    - import_role:
        name: kafka_broker

    - name: Proceed Prompt
      pause:
        prompt: "Press Enter to Proceed to Next Node. Ctrl + C to Abort"
      when: kafka_broker_pause_rolling_deployment|bool

- name: Kafka Broker Controller Provisioning
  hosts: kafka_broker_controller
  any_errors_fatal: true
  gather_facts: false
  tags: kafka_broker
  environment: "{{ proxy_env }}"
  tasks:
    - import_role:
        name: kafka_broker

    - name: Proceed Prompt
      pause:
        prompt: "Press Enter to Proceed to Next Node. Ctrl + C to Abort"
      when: kafka_broker_pause_rolling_deployment|bool
