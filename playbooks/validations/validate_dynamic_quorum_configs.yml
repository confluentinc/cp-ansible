---
- name: KRaft Dynamic Quorum Configuration Validations
  hosts: kafka_controller
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - import_role:
        name: variables

    - name: Validate KRaft Dynamic Quorum Prerequisites
      assert:
        that:
          - kraft_enabled | bool
          - confluent_package_version is version('8.3.0', '>=')
        fail_msg: |
          ERROR: Invalid KRaft dynamic quorum (KIP-853) configuration.
          Dynamic quorum requires:
            - kraft_enabled: true
            - Confluent Platform 8.3.0 or later (found {{ confluent_package_version }})
        success_msg: "KRaft dynamic quorum prerequisites satisfied"
      run_once: true
      when: kraft_dynamic_quorum_enabled | bool

    - name: Get Existing Master Key for Dynamic Quorum Migration Guard
      include_role:
        name: common
        tasks_from: get_masterkey.yml
      vars:
        systemd_override_path: "{{ kafka_controller.systemd_override }}"
        rootless_component_name: kafka_controller
      when:
        - kraft_dynamic_quorum_enabled|bool
        - kafka_controller_secrets_protection_enabled|bool

    - name: Detect Existing KRaft Data Directory for Dynamic Quorum Migration Guard
      command: "{{ binary_base_path }}/bin/kafka-storage info -c {{ kafka_controller.config_file }}"
      environment: "{{ {'CONFLUENT_SECURITY_MASTER_KEY': existing_masterkey} if kafka_controller_secrets_protection_enabled|bool and existing_masterkey | default('') != '' else {} }}"
      register: kraft_guard_formatted
      changed_when: false
      failed_when: false
      check_mode: false
      when: kraft_dynamic_quorum_enabled|bool

    - name: Read KRaft Feature Version on Existing Cluster for Dynamic Quorum Migration Guard
      shell: |
        {{ binary_base_path }}/bin/kafka-features --bootstrap-controller {{inventory_hostname}}:{{kafka_controller_port}} \
          --command-config {{kafka_controller.client_config_file}} describe \
          | grep 'kraft.version' | grep -oE 'FinalizedVersionLevel: [0-9]+' | awk '{print $2}'
      args:
        executable: "{{ shell_executable }}"
      environment:
        KAFKA_OPTS: "-Xlog:all=error -XX:+IgnoreUnrecognizedVMOptions {% if kerberos_client_config_file_dest != '/etc/krb5.conf' %}-Djava.security.krb5.conf={{kerberos_client_config_file_dest}}{% endif %}"
      register: kraft_guard_version
      changed_when: false
      failed_when: false
      check_mode: false
      when:
        - kraft_dynamic_quorum_enabled|bool
        - kraft_guard_formatted.rc | default(1) == 0

    - name: Fail When Applying Dynamic Quorum Config to a Static KRaft Cluster
      fail:
        msg: >-
          Detected a running static KRaft cluster (kraft.version=0). Applying dynamic quorum
          configuration directly is unsafe. Run playbooks/StaticToDynamicQuorumMigration.yaml
          to upgrade kraft.version and switch to controller.quorum.bootstrap.servers.
      when:
        - kraft_dynamic_quorum_enabled|bool
        - kraft_guard_formatted.rc | default(1) == 0
        - kraft_guard_version.stdout | default('') | trim == '0'
