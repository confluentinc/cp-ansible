---
- name: KRaft Static-to-Dynamic Quorum Migration - Precheck and Feature Upgrade
  hosts: kafka_controller
  gather_facts: true
  environment: "{{ proxy_env }}"
  tasks:
    - import_role:
        name: variables

    - name: Assert Dynamic Quorum Is Requested in Inventory
      assert:
        that:
          - kraft_dynamic_quorum_enabled | bool
        fail_msg: "Set kraft_dynamic_quorum_enabled: true in your inventory before running the static-to-dynamic migration."
      run_once: true

    - name: Health Check the Existing Controller Quorum Before Migration
      include_role:
        name: kafka_controller
        tasks_from: health_check.yml

    - name: Read Current KRaft Feature Version
      shell: |
        {{ binary_base_path }}/bin/kafka-features --bootstrap-controller {{inventory_hostname}}:{{kafka_controller_port}} \
          --command-config {{kafka_controller.client_config_file}} describe \
          | grep 'kraft.version' | grep -oE 'FinalizedVersionLevel: [0-9]+' | awk '{print $2}'
      args:
        executable: "{{ shell_executable }}"
      environment:
        KAFKA_OPTS: "-Xlog:all=error -XX:+IgnoreUnrecognizedVMOptions {% if kerberos_client_config_file_dest != '/etc/krb5.conf' %}-Djava.security.krb5.conf={{kerberos_client_config_file_dest}}{% endif %}"
      register: kraft_feature_version
      changed_when: false
      check_mode: false
      run_once: true

    - name: Assert KRaft Feature Version Is a Known Migratable State
      assert:
        that:
          - kraft_feature_version.stdout | trim in ['0', '1']
        fail_msg: >-
          Expected kraft.version 0 (static, to be upgraded) or 1 (already upgraded, resuming a
          previous migration) but read '{{ kraft_feature_version.stdout | trim }}'. Ensure the
          controller quorum is healthy and re-run.
      run_once: true

    - name: Upgrade KRaft Feature to Dynamic Quorum (kraft.version=1)
      shell: |
        {{ binary_base_path }}/bin/kafka-features --bootstrap-controller {{inventory_hostname}}:{{kafka_controller_port}} \
          --command-config {{kafka_controller.client_config_file}} upgrade --feature kraft.version=1
      args:
        executable: "{{ shell_executable }}"
      environment:
        KAFKA_OPTS: "-Xlog:all=error -XX:+IgnoreUnrecognizedVMOptions {% if kerberos_client_config_file_dest != '/etc/krb5.conf' %}-Djava.security.krb5.conf={{kerberos_client_config_file_dest}}{% endif %}"
      register: kraft_feature_upgrade
      changed_when: kraft_feature_upgrade.rc == 0
      run_once: true
      when: kraft_feature_version.stdout | trim == '0'

    - name: Verify KRaft Feature Version Is 1
      shell: |
        {{ binary_base_path }}/bin/kafka-features --bootstrap-controller {{inventory_hostname}}:{{kafka_controller_port}} \
          --command-config {{kafka_controller.client_config_file}} describe \
          | grep 'kraft.version' | grep -oE 'FinalizedVersionLevel: [0-9]+' | awk '{print $2}'
      args:
        executable: "{{ shell_executable }}"
      environment:
        KAFKA_OPTS: "-Xlog:all=error -XX:+IgnoreUnrecognizedVMOptions {% if kerberos_client_config_file_dest != '/etc/krb5.conf' %}-Djava.security.krb5.conf={{kerberos_client_config_file_dest}}{% endif %}"
      register: kraft_feature_version_post
      changed_when: false
      check_mode: false
      failed_when: kraft_feature_version_post.stdout | trim != '1'
      run_once: true

- import_playbook: kafka_controller.yml
  vars:
    deployment_strategy: rolling

- import_playbook: kafka_broker.yml
  vars:
    deployment_strategy: rolling

- name: KRaft Static-to-Dynamic Quorum Migration - Verify Controller Quorum
  hosts: kafka_controller
  gather_facts: true
  environment: "{{ proxy_env }}"
  tasks:
    - import_role:
        name: variables

    - include_role:
        name: kafka_controller
        tasks_from: health_check.yml

- name: KRaft Static-to-Dynamic Quorum Migration - Verify Brokers
  hosts: kafka_broker
  gather_facts: true
  environment: "{{ proxy_env }}"
  tasks:
    - import_role:
        name: variables

    - include_role:
        name: kafka_broker
        tasks_from: health_check.yml
