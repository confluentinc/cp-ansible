---
# Secure-by-default Confluent Platform deployment: one component per host, rootless,
# mTLS everywhere, RBAC, secrets protection. Deploy phase - run as the unprivileged
# deployment_user (see docs/SECURE_DEPLOYMENT.md for the one-time bootstrap).
#
#   ansible-playbook -i <inventory> confluent.platform.secure_all --ask-vault-pass
#
# Order: pre-flight gate -> host validation -> deploy -> post-deploy verification.
# Any failed pre-flight assertion stops the run before a single file is written to a host.

- import_playbook: secure_preflight.yml

- import_playbook: validate_hosts.yml

- import_playbook: all.yml

- import_playbook: secure_verify.yml
