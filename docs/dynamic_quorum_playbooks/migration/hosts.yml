---
### KRaft Static to Dynamic Quorum Migration
##
## Example inventory for an existing Confluent Platform cluster that runs a static KRaft quorum
## and is being migrated to a dynamic quorum with playbooks/StaticToDynamicQuorumMigration.yaml.
## This is the inventory the cluster was deployed with, plus kraft_dynamic_quorum_enabled: true.
##
## See README.md in this folder for the full procedure.

all:
  vars:
    ansible_connection: ssh
    ansible_user: ec2-user
    ansible_become: true
    ansible_ssh_private_key_file: /tmp/certs/ssh_priv.pem

    confluent_package_version: 8.4.0

    ## The target state. Add this line to the existing inventory, then run the migration playbook.
    ## kafka_controller_initial_voter is not needed for a migrated cluster.
    kraft_dynamic_quorum_enabled: true

kafka_controller:
  hosts:
    kcontroller-1.example.com:
    kcontroller-2.example.com:
    kcontroller-3.example.com:

kafka_broker:
  hosts:
    kafka-1.example.com:
    kafka-2.example.com:
    kafka-3.example.com:
