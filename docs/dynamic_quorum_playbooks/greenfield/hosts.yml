---
### KRaft Dynamic Quorum: Greenfield, Single Region
##
## Example inventory for a new Confluent Platform cluster with a dynamic KRaft controller quorum.
## 3 controllers and 3 brokers in one region. The quorum has 3 voters, needs 2, and tolerates 1 failure.
##
## See README.md in this folder for the full procedure.

all:
  vars:
    ansible_connection: ssh
    ansible_user: ec2-user
    ansible_become: true
    ansible_ssh_private_key_file: /tmp/certs/ssh_priv.pem

    confluent_package_version: 8.4.0

    ## Deploy the controllers with a dynamic quorum.
    kraft_dynamic_quorum_enabled: true

    ## The one controller that creates the new quorum. It must be a kafka_controller inventory hostname.
    ## Only used on the first deployment.
    kafka_controller_initial_voter: kcontroller-1.example.com

kafka_controller:
  hosts:
    kcontroller-1.example.com:
    kcontroller-2.example.com:
    kcontroller-3.example.com:

kafka_broker:
  hosts:
    kafka-1.example.com:
    kafka-2.example.com:
    kafka-3.example.com:
