---
### KRaft Dynamic Quorum: Remove Controllers
##
## Example inventory after replacing kcontroller-2 in a running 3-controller dynamic quorum.
## kcontroller-2 was removed from the quorum and from the inventory, and kcontroller-4 replaces it.
## The cluster still has 3 controllers.
##
## See README.md in this folder for the full procedure.

all:
  vars:
    ansible_connection: ssh
    ansible_user: ec2-user
    ansible_become: true
    ansible_ssh_private_key_file: /tmp/certs/ssh_priv.pem

    confluent_package_version: 8.4.0

    kraft_dynamic_quorum_enabled: true

    kafka_controller_initial_voter: kcontroller-1.example.com

kafka_controller:
  hosts:
    ## node_id is pinned on every controller, so removing a host does not change the others' node ids.
    kcontroller-1.example.com:
      node_id: 9991
    ## Removed from the quorum, then removed from the inventory
    # kcontroller-2.example.com:
    #   node_id: 9992
    kcontroller-3.example.com:
      node_id: 9993
    ## Replacement, added with the Add Controllers guide
    kcontroller-4.example.com:
      node_id: 9994

kafka_broker:
  hosts:
    kafka-1.example.com:
    kafka-2.example.com:
    kafka-3.example.com:
