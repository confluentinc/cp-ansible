---
### KRaft Dynamic Quorum: Remove Controllers
##
## Example inventory after removing 2 controllers from a running 5-controller dynamic quorum.
## The quorum shrinks from 5 voters (tolerates 2 failures) to 3 voters (tolerates 1 failure).
##
## See README.md in this folder for the full procedure.

all:
  vars:
    ansible_connection: ssh
    ansible_user: ec2-user
    ansible_become: true
    ansible_ssh_private_key_file: /tmp/certs/ssh_priv.pem

    confluent_package_version: 8.4.0

    kraft_dynamic_quorum_enabled: true

    ## Only used on the first deployment. If you remove this controller, you can point it at any remaining one.
    kafka_controller_initial_voter: kcontroller-1.example.com

kafka_controller:
  hosts:
    kcontroller-1.example.com:
    kcontroller-2.example.com:
    kcontroller-3.example.com:
    ## Removed from the quorum, then removed from the inventory
    # kcontroller-4.example.com:
    # kcontroller-5.example.com:

kafka_broker:
  hosts:
    kafka-1.example.com:
    kafka-2.example.com:
    kafka-3.example.com:
