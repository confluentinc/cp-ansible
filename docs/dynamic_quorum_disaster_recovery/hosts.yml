---
### KRaft Dynamic Quorum Disaster Recovery
##
## Example inventory for a two-region (2DC 3-3) Confluent Platform cluster with a dynamic KRaft controller quorum.
## Each region runs 3 controllers and 3 brokers. The quorum has 6 voters, so it needs 4 to stay available.
## Losing a whole region (3 voters) loses the quorum, but no committed metadata is lost,
## so this layout can be recovered with the KRaftQuorumRecovery playbook with no data loss.
##
## See README.md in this folder for the full recovery procedure.

all:
  vars:
    ansible_connection: ssh
    ansible_user: ec2-user
    ansible_become: true
    ansible_ssh_private_key_file: /tmp/certs/ssh_priv.pem

    confluent_package_version: 8.4.0

    ## Dynamic quorum. Required for the recovery playbook.
    kraft_dynamic_quorum_enabled: true
    ## The controller that formats first on a new cluster. Only used on the very first deployment.
    kafka_controller_initial_voter: kcontroller-1.dc1.example.com

    ## Disaster recovery settings. Do not keep these in the inventory during normal operation.
    ## Set them only while running playbooks/KRaftQuorumRecovery.yaml, either here or with -e on the command line.
    ##
    ## Hosts that are lost and must stay stopped during recovery. The playbook never connects to them.
    # kraft_quorum_recovery_failed_hosts:
    #   - kcontroller-1.dc1.example.com
    #   - kcontroller-2.dc1.example.com
    #   - kcontroller-3.dc1.example.com
    #   - kafka-1.dc1.example.com
    #   - kafka-2.dc1.example.com
    #   - kafka-3.dc1.example.com
    ##
    ## Confirms that the failed hosts are stopped. The playbook refuses to run without it.
    # kraft_quorum_recovery_confirmed: true
    ##
    ## Optional. Forces a specific seed controller instead of the one the playbook picks.
    ## Only use this when Confluent Support asks you to.
    # kraft_quorum_recovery_seed: kcontroller-1.dc2.example.com
    ##
    ## Only for resuming a run that stopped while the voter set was being rebuilt.
    ## Set it after Confluent Support confirms the rebuild finished.
    # kraft_quorum_recovery_force_standalone_done: true

kafka_controller:
  hosts:
    ## Region dc1
    kcontroller-1.dc1.example.com:
    kcontroller-2.dc1.example.com:
    kcontroller-3.dc1.example.com:
    ## Region dc2
    kcontroller-1.dc2.example.com:
    kcontroller-2.dc2.example.com:
    kcontroller-3.dc2.example.com:

kafka_broker:
  hosts:
    ## Region dc1
    kafka-1.dc1.example.com:
      kafka_broker_custom_properties:
        broker.rack: dc1
        replica.selector.class: org.apache.kafka.common.replica.RackAwareReplicaSelector
    kafka-2.dc1.example.com:
      kafka_broker_custom_properties:
        broker.rack: dc1
        replica.selector.class: org.apache.kafka.common.replica.RackAwareReplicaSelector
    kafka-3.dc1.example.com:
      kafka_broker_custom_properties:
        broker.rack: dc1
        replica.selector.class: org.apache.kafka.common.replica.RackAwareReplicaSelector
    ## Region dc2
    kafka-1.dc2.example.com:
      kafka_broker_custom_properties:
        broker.rack: dc2
        replica.selector.class: org.apache.kafka.common.replica.RackAwareReplicaSelector
    kafka-2.dc2.example.com:
      kafka_broker_custom_properties:
        broker.rack: dc2
        replica.selector.class: org.apache.kafka.common.replica.RackAwareReplicaSelector
    kafka-3.dc2.example.com:
      kafka_broker_custom_properties:
        broker.rack: dc2
        replica.selector.class: org.apache.kafka.common.replica.RackAwareReplicaSelector
