---
##
## Example inventory for a single-region (1DC) KRaft cluster using dynamic controller quorum (KIP-853).
##
## Dynamic quorum lets controllers be added/removed at runtime. It requires Confluent Platform 8.4.0 or later.
## Set kraft_dynamic_quorum_enabled: true and pick one controller as kafka_controller_initial_voter.
## The bootstrap controller formats storage as the sole initial voter; the others join as observers and are
## promoted to voters automatically (CP 8.2+ auto-join). For availability, use an odd number of controllers
## (3 is typical) spread across availability zones so losing one AZ keeps a majority.

all:
  vars:
    ansible_connection: ssh
    ansible_user: ec2-user
    ansible_become: true
    ansible_ssh_private_key_file: /home/ec2-user/guest.pem
    ansible_python_interpreter: /usr/bin/python3

    kraft_dynamic_quorum_enabled: true
    kafka_controller_initial_voter: ec2-35-160-193-90.us-west-2.compute.amazonaws.com

kafka_controller:
  hosts:
    ec2-35-160-193-90.us-west-2.compute.amazonaws.com:
    ec2-35-85-219-150.us-west-2.compute.amazonaws.com:
    ec2-34-219-169-190.us-west-2.compute.amazonaws.com:

kafka_broker:
  hosts:
    ec2-35-91-214-11.us-west-2.compute.amazonaws.com:
    ec2-54-71-228-219.us-west-2.compute.amazonaws.com:
    ec2-54-218-9-145.us-west-2.compute.amazonaws.com:

schema_registry:
  hosts:
    ec2-35-160-193-90.us-west-2.compute.amazonaws.com:

kafka_rest:
  hosts:
    ec2-34-219-169-190.us-west-2.compute.amazonaws.com:

control_center_next_gen:
  hosts:
    ec2-35-85-219-154.us-west-2.compute.amazonaws.com:
