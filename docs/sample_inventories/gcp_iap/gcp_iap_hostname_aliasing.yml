---
##
## The following is an example inventory file for deploying Confluent Platform
## to GCP VMs that are only reachable through Identity-Aware Proxy (IAP) TCP forwarding,
## using the google.cloud.iap connection plugin, with hostname aliasing enabled.
##
## Use this layout when you want short inventory names (zk1, broker1, ...) instead of
## the VM's network address. For prerequisites and plugin settings, see gcp_iap_plugin.yml.
##
## When using the IAP plugin, ansible_host must contain the GCE instance name so the plugin
## can open the tunnel. Since hostname_aliasing_enabled uses ansible_host as a fallback for
## resolving the internal hostname, you must explicitly set the "hostname" variable on each
## host to the VM's network address (FQDN or IP) so that Confluent Platform components can
## communicate with each other correctly.
##
## Resolution order when hostname_aliasing_enabled is true:
##   1. hostname (host variable)
##   2. ansible_host (fallback - but this is the instance name with IAP, so don't rely on it)
##   3. inventory_hostname (final fallback)
##
## Usage:
##   ansible-playbook -i docs/sample_inventories/gcp_iap/gcp_iap_hostname_aliasing.yml confluent.platform.all

all:
  vars:
    confluent_package_version: 7.9.10
    ## IAP connection settings
    ansible_connection: google.cloud.iap
    ansible_gcloud_project: my-gcp-project
    ansible_user: my_ssh_user
    ansible_become: true
    ansible_ssh_timeout: 60
    ansible_pipelining: true

    ## Enable hostname aliasing so that the "hostname" variable is used
    ## for internal CP component addressing instead of ansible_host (which holds the instance name).
    hostname_aliasing_enabled: true

zookeeper:
  hosts:
    zk1:
      ansible_host: zk1
      ansible_gcloud_zone: us-central1-a
      hostname: zk1.us-central1-a.c.my-gcp-project.internal
    zk2:
      ansible_host: zk2
      ansible_gcloud_zone: us-central1-b
      hostname: zk2.us-central1-b.c.my-gcp-project.internal
    zk3:
      ansible_host: zk3
      ansible_gcloud_zone: us-central1-c
      hostname: zk3.us-central1-c.c.my-gcp-project.internal

kafka_broker:
  hosts:
    broker1:
      ansible_host: broker1
      ansible_gcloud_zone: us-central1-a
      hostname: broker1.us-central1-a.c.my-gcp-project.internal
    broker2:
      ansible_host: broker2
      ansible_gcloud_zone: us-central1-b
      hostname: broker2.us-central1-b.c.my-gcp-project.internal
    broker3:
      ansible_host: broker3
      ansible_gcloud_zone: us-central1-c
      hostname: broker3.us-central1-c.c.my-gcp-project.internal
