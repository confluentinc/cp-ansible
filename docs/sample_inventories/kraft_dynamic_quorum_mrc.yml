---
##
## Example inventory for a Multi-Region Cluster (MRC) using KRaft dynamic controller quorum (KIP-853).
##
## This uses a 2DC "3-3" layout: 3 controllers in each region (6 voters, majority 4). Sizing rule:
## no single region may hold a commit-majority on its own (3 < 4 here), so every metadata write must be
## acknowledged across both regions. Avoid asymmetric layouts such as 2-3, where the larger region is a
## self-sufficient majority and losing it can lose committed writes.
##
## Requires Confluent Platform 8.4.0 or later. All hosts across both regions must be reachable from the
## Ansible control node and routable to each other. Controller advertised.listeners are templated
## automatically; set a per-host 'hostname' under kafka_controller_custom_listeners only if a controller
## must advertise a different cross-region address than its inventory hostname.

all:
  vars:
    ansible_connection: ssh
    ansible_user: ec2-user
    ansible_become: true
    ansible_ssh_private_key_file: /home/ec2-user/guest.pem
    ansible_python_interpreter: /usr/bin/python3

    kraft_dynamic_quorum_enabled: true
    kafka_controller_bootstrap_node: ec2-region-a-controller1.example.com

kafka_controller:
  hosts:
    ec2-region-a-controller1.example.com:
    ec2-region-a-controller2.example.com:
    ec2-region-a-controller3.example.com:
    ec2-region-b-controller1.example.com:
    ec2-region-b-controller2.example.com:
    ec2-region-b-controller3.example.com:

kafka_broker:
  hosts:
    ec2-region-a-broker1.example.com:
      kafka_broker_custom_properties:
        broker.rack: region-a
        replica.selector.class: org.apache.kafka.common.replica.RackAwareReplicaSelector
    ec2-region-a-broker2.example.com:
      kafka_broker_custom_properties:
        broker.rack: region-a
        replica.selector.class: org.apache.kafka.common.replica.RackAwareReplicaSelector
    ec2-region-a-broker3.example.com:
      kafka_broker_custom_properties:
        broker.rack: region-a
        replica.selector.class: org.apache.kafka.common.replica.RackAwareReplicaSelector
    ec2-region-b-broker1.example.com:
      kafka_broker_custom_properties:
        broker.rack: region-b
        replica.selector.class: org.apache.kafka.common.replica.RackAwareReplicaSelector
    ec2-region-b-broker2.example.com:
      kafka_broker_custom_properties:
        broker.rack: region-b
        replica.selector.class: org.apache.kafka.common.replica.RackAwareReplicaSelector
    ec2-region-b-broker3.example.com:
      kafka_broker_custom_properties:
        broker.rack: region-b
        replica.selector.class: org.apache.kafka.common.replica.RackAwareReplicaSelector

schema_registry:
  hosts:
    ec2-region-a-broker1.example.com:

kafka_rest:
  hosts:
    ec2-region-b-broker1.example.com:

control_center_next_gen:
  hosts:
    ec2-region-a-controller1.example.com:
