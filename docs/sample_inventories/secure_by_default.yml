---
### SECURE-BY-DEFAULT Confluent Platform template
##
## Maximum-security / maximum-isolation baseline for customers. It combines:
##   - Isolation : every component on its OWN host (enforced by playbooks/secure_preflight.yml)
##   - Rootless  : unprivileged deploy user, systemd --user, archive install, no sudo
##   - mTLS      : TLS on every endpoint, client certificates required, CA-signed certs
##   - RBAC      : MDS with LDAP user store; component principals authenticate to MDS
##   - Secrets   : secrets protection + log redactor + audit logs + vaulted credentials
##
## Run (see docs/SECURE_DEPLOYMENT.md for the full walkthrough):
##   1. ansible-playbook -i <this> confluent.platform.rootless_bootstrap -e ansible_user=<admin> -e ansible_become=true -e rootless_install_packages=true
##      (ansible_become must be overridden: this inventory sets it to false, which would otherwise
##       beat the playbook's own become and leave a non-root admin unprivileged)
##   2. ansible-playbook -i <this> confluent.platform.secure_preflight --ask-vault-pass
##   3. ansible-playbook -i <this> confluent.platform.secure_all --ask-vault-pass
##   4. ansible-playbook -i <this> confluent.platform.secure_network -e ansible_user=<admin> \
##        -e '{"secure_network_admin_cidrs":["<control-node-ip>/32"],"secure_network_ldap_hosts":["<ldap-ip>"]}'
##
## Scope: kafka_controller, kafka_broker, schema_registry, kafka_connect, ksql, kafka_rest and
## control_center_next_gen. kafka_connect_replicator / usm_agent are rejected by pre-flight.
##
## Every value in <angle brackets> must be replaced. Every vault_* variable must live in an
## Ansible Vault file (ansible-vault create group_vars/all/vault.yml) - never in this file.

all:
  vars:
    # Must be a version published at packages.confluent.io/archive (8.4.0 is not; 8.3.0 was tested).
    confluent_package_version: 8.3.0

    ## ---- Rootless (no root, no sudo, no privilege escalation) ---------------------------
    ansible_user: cp-user
    ansible_become: false
    rootless_enabled: true
    installation_method: archive
    deployment_user: cp-user
    deployment_group: cp-user
    rootless_deployment_path: /home/cp-user/cp-data
    # Bring your own, patched JDK so the deploy never needs root to install Java.
    # custom_java_path: /home/cp-user/cp-data/jdk

    ## ---- mTLS: CA-signed certificates from YOUR PKI (snakeoil CA is rejected by pre-flight)
    ssl_enabled: true
    ssl_mutual_auth_enabled: true
    ssl_client_authentication: required
    mds_ssl_client_authentication: required
    ssl_custom_certs: true
    # One cert per host is looked up under these paths by cp-ansible; see the "Custom Certs"
    # section of the Confluent Ansible encryption docs for per-host file naming.
    ssl_ca_cert_filepath: "<path on control node>/ca.pem"
    ssl_signed_cert_filepath: "<path on control node>/{{ inventory_hostname }}.pem"
    ssl_key_filepath: "<path on control node>/{{ inventory_hostname }}-key.pem"
    ssl_key_password: "{{ vault_ssl_key_password }}"
    # Without this, keystores are created with cp-ansible's well-known default passwords.
    ssl_keystore_and_truststore_custom_password: true
    ssl_keystore_store_password: "{{ vault_ssl_keystore_store_password }}"
    ssl_keystore_key_password: "{{ vault_ssl_keystore_key_password }}"
    ssl_truststore_password: "{{ vault_ssl_truststore_password }}"
    ssl_self_signed_ca_password: "{{ vault_ssl_ca_password }}"

    ## ---- RBAC over LDAP (validated rootless pattern: non_root_deployment_rbac_ldap.yml) ----
    rbac_enabled: true
    auth_mode: ldap
    mds_super_user: mds
    mds_super_user_password: "{{ vault_mds_super_user_password }}"
    ldap_base_properties: &ldap_base_properties
      confluent.authorizer.init.timeout.ms: 1800000
      ldap.java.naming.factory.initial: com.sun.jndi.ldap.LdapCtxFactory
      ldap.com.sun.jndi.ldap.read.timeout: 3000
      # Use ldaps:// so directory credentials are not sent in clear text.
      ldap.java.naming.provider.url: "ldaps://<your-ldap-host>:636"
      ldap.java.naming.security.principal: "uid=mds,OU=rbac,DC=<your-dc>,DC=<your-dc-extension>"
      ldap.java.naming.security.credentials: "{{ mds_super_user_password }}"
      ldap.java.naming.security.authentication: simple
      ldap.user.search.base: "OU=rbac,DC=<your-dc>,DC=<your-dc-extension>"
      ldap.group.search.base: "OU=rbac,DC=<your-dc>,DC=<your-dc-extension>"
      ldap.user.name.attribute: uid
      ldap.user.memberof.attribute.pattern: "CN=(.*),OU=rbac,DC=<your-dc>,DC=<your-dc-extension>"
      ldap.group.name.attribute: cn
      ldap.group.member.attribute.pattern: "CN=(.*),OU=rbac,DC=<your-dc>,DC=<your-dc-extension>"
      ldap.user.object.class: account
    kafka_broker_custom_properties: *ldap_base_properties
    kafka_controller_custom_properties: *ldap_base_properties

    # Each component authenticates to MDS as its own least-privilege principal.
    schema_registry_ldap_user: <schema-registry-principal>
    schema_registry_ldap_password: "{{ vault_schema_registry_ldap_password }}"
    kafka_connect_ldap_user: <kafka-connect-principal>
    kafka_connect_ldap_password: "{{ vault_kafka_connect_ldap_password }}"
    kafka_rest_ldap_user: <kafka-rest-principal>
    kafka_rest_ldap_password: "{{ vault_kafka_rest_ldap_password }}"
    ksql_ldap_user: <ksql-principal>
    ksql_ldap_password: "{{ vault_ksql_ldap_password }}"
    control_center_next_gen_ldap_user: <control-center-principal>
    control_center_next_gen_ldap_password: "{{ vault_control_center_next_gen_ldap_password }}"

    ## ---- Secrets, logs, audit ---------------------------------------------------------------
    secrets_protection_enabled: true
    mask_secrets: true

    logredactor_enabled: true
    logredactor_rule_path_local: docs/rules_example.json   # replace with your own rules

    kafka_broker_cluster_name: <cluster-name>
    audit_logs_destination_enabled: true
    # The audit cluster is outside the inventory, so secure_network cannot see all of its brokers:
    # it opens egress to the bootstrap addresses below. Clients also connect to every ADVERTISED broker,
    # so add them all with -e secure_network_extra_egress='[{"name":"audit","to":["<ip>",...],"ports":[9092]}]'.
    audit_logs_destination_bootstrap_servers: "<audit-broker-1>:9092,<audit-broker-2>:9092"
    audit_logs_destination_listener:
      ssl_enabled: true
      sasl_protocol: none

    ## ---- Bundled Prometheus/Alertmanager (C3 host): the global ssl flags do not reach them -------
    ## Without these, broker/controller telemetry is sent over unauthenticated HTTP (pre-flight rejects it).
    control_center_next_gen_dependency_prometheus_ssl_enabled: true
    control_center_next_gen_dependency_prometheus_mtls_enabled: true
    control_center_next_gen_dependency_alertmanager_ssl_enabled: true
    control_center_next_gen_dependency_alertmanager_mtls_enabled: true

    ## ---- Left off on purpose (secure default): Jolokia / JMX exporter ----------------------------
    jolokia_enabled: false
    jmxexporter_enabled: false

## ---- Isolation: ONE component per host. Pre-flight fails if a host appears twice. -------------
kafka_controller:
  hosts:
    <controller-1>:
    <controller-2>:
    <controller-3>:
kafka_broker:
  hosts:
    <broker-1>:
    <broker-2>:
    <broker-3>:
schema_registry:
  hosts:
    <schema-registry-1>:
kafka_connect:
  hosts:
    <connect-1>:
kafka_rest:
  hosts:
    <kafka-rest-1>:
ksql:
  hosts:
    <ksql-1>:
control_center_next_gen:
  hosts:
    <control-center-1>:
