---
### USM Agent + Command Handler
##
## Example inventory that enables the USM Agent Command Handler, which lets
## Confluent Cloud manage self-managed Kafka Connect clusters *through* the
## agent. The command-handler ships in the same confluent-usm-agent package and
## runs as a sibling service on the usm_agent host.

all:
  vars:
    ansible_connection: ssh
    ansible_user: ec2-user
    ansible_become: true
    ansible_ssh_private_key_file: /home/ec2-user/guest.pem

    ssl_enabled: false
    ssl_mutual_auth_enabled: false

    # ── USM Agent → Confluent Cloud ──
    ccloud_endpoint: "https://api.confluent.cloud:443"
    ccloud_environment_id: env-mock-123
    ccloud_credential:
      username: "your-ccloud-api-key"
      password: "your-ccloud-api-secret"
    usm_agent_basic_auth_enabled: false
    usm_agent_ssl_enabled: false
    usm_agent_ssl_mutual_auth_enabled: false

    # ── Command Handler ──
    # Listing one or more Connect clusters turns the Command Handler on -- there
    # is no separate on/off flag (mirrors the agent, which is enabled by being in
    # the usm_agent group). Each cluster's `name` is a slug used as the registry
    # key.
    usm_agent_command_handler_connect_clusters:
      # plain HTTP, no auth (auth_type omitted -- defaults to none)
      dev-connect:
        url: http://connect-dev.internal:8083
        group_id: connect-cluster

      # HTTPS with basic auth and a private CA (path on the control node; copied
      # to the agent host to verify Connect's cert)
      prod-east:
        url: https://connect-east.internal:8083
        group_id: connect-prod-east
        auth_type: basic
        basic_auth_username: usm-agent
        basic_auth_password: "{{ vault_prod_east_connect_password }}"
        ca_cert_path: /path/to/connect_east_ca.crt

      # HTTPS trusting cp-ansible's self-signed CA (no CA file needed)
      prod-west:
        url: https://connect-west.internal:8083
        group_id: connect-prod-west
        autogen_ca: true

    # Other Command Handler tunable/config options:
    #   usm_agent_command_handler_custom_properties:   # merge any raw CH setting
    #     poll.timeout.ms: 10000
    #   usm_agent_command_handler_custom_args: "-log-level debug"  # CLI flags (e.g. log level)

usm_agent:
  hosts:
    usm-agent1.confluent.io:

kafka_controller:
  hosts:
    controller1.confluent.io:

kafka_broker:
  hosts:
    kfk[01:03].confluent.io:

kafka_connect:
  hosts:
    kafka-connect1.confluent.io:
