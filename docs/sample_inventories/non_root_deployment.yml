---
### NON-ROOT CP installation
##
## Sample inventory file for installing Confluent Platform without root access
## https://docs.confluent.io/ansible/current/ansible-install.html#install-confluent-platform-without-root-access
##
## With deployment_user / deployment_group / deployment_path set below, cp-ansible
## automatically derives every user, group, log dir, data dir, SSL dir, CLI path,
## JMX-exporter jar path and the archive install path under deployment_path.
## You no longer need to override each of them individually.

all:
  vars:
    # The only three knobs required for a non-root deployment.
    # All service accounts run as this user/group ...
    deployment_user: cp-user
    deployment_group: cp-user
    # ... and every artifact (binaries, config, logs, data, certs) lands under this base path,
    # which must be writable by deployment_user.
    deployment_path: /cp-data

    # Non-root uses the archive install method (the package method needs root for the yum/apt repo + RPM/DEB install).
    installation_method: archive

    # Rootless runs are not systemd-managed, so skip the systemd-driven restart handlers.
    zookeeper_skip_restarts: true
    kafka_controller_skip_restarts: true
    kafka_broker_skip_restarts: true
    schema_registry_skip_restarts: true
    kafka_rest_skip_restarts: true
    kafka_connect_skip_restarts: true
    ksql_skip_restarts: true
    control_center_skip_restarts: true

    ## --- Optional overrides -------------------------------------------------
    ## Everything below is derived automatically from deployment_path. Uncomment
    ## only to point an individual path somewhere other than under deployment_path.
    #
    # archive_destination_path: "{{ deployment_path }}/confluent"
    # confluent_cli_base_path: "{{ deployment_path }}/confluent-cli"
    # ssl_file_dir: "{{ deployment_path }}/ssl"
    # jmxexporter_jar_path: "{{ deployment_path }}/jmx_exporter/jmx_prometheus_javaagent.jar"
    # kafka_connect_confluent_hub_plugins_dest: "{{ deployment_path }}/connect-plugins"
    # kafka_connect_plugins_dest: "{{ deployment_path }}/connect-plugins"
    #
    ## If using a user-supplied JDK tarball (no root to create the /usr/bin/java symlink),
    ## point custom_java_path at its home; it is wired into JAVA_HOME for every component.
    # custom_java_path: "{{ deployment_path }}/jdk"
