---
### KRaft Dynamic Quorum: Greenfield, Two Regions (2DC 3-3)
##
## Example inventory for a new two-region Confluent Platform cluster with a dynamic KRaft controller quorum.
## Each region runs 3 controllers and 3 brokers. The quorum has 6 voters and needs 4.
## Losing one region loses the quorum, but it can be recovered with no metadata loss.
## See docs/dynamic_quorum_disaster_recovery.
##
## See README.md in this folder for the full procedure.

all:
  vars:
    ansible_connection: ssh
    ansible_user: ec2-user
    ansible_become: true
    ansible_ssh_private_key_file: /tmp/certs/ssh_priv.pem

    confluent_package_version: 8.4.0

    ## Deploy the controllers with a dynamic quorum.
    kraft_dynamic_quorum_enabled: true

    ## The one controller that creates the new quorum. It must be a kafka_controller inventory hostname.
    ## Only used on the first deployment.
    kafka_controller_initial_voter: kcontroller-1.dc1.example.com

kafka_controller:
  hosts:
    ## Region dc1
    kcontroller-1.dc1.example.com:
    kcontroller-2.dc1.example.com:
    kcontroller-3.dc1.example.com:
    ## Region dc2
    kcontroller-1.dc2.example.com:
    kcontroller-2.dc2.example.com:
    kcontroller-3.dc2.example.com:

kafka_broker:
  hosts:
    ## Region dc1
    kafka-1.dc1.example.com:
      kafka_broker_custom_properties:
        broker.rack: dc1
        replica.selector.class: org.apache.kafka.common.replica.RackAwareReplicaSelector
    kafka-2.dc1.example.com:
      kafka_broker_custom_properties:
        broker.rack: dc1
        replica.selector.class: org.apache.kafka.common.replica.RackAwareReplicaSelector
    kafka-3.dc1.example.com:
      kafka_broker_custom_properties:
        broker.rack: dc1
        replica.selector.class: org.apache.kafka.common.replica.RackAwareReplicaSelector
    ## Region dc2
    kafka-1.dc2.example.com:
      kafka_broker_custom_properties:
        broker.rack: dc2
        replica.selector.class: org.apache.kafka.common.replica.RackAwareReplicaSelector
    kafka-2.dc2.example.com:
      kafka_broker_custom_properties:
        broker.rack: dc2
        replica.selector.class: org.apache.kafka.common.replica.RackAwareReplicaSelector
    kafka-3.dc2.example.com:
      kafka_broker_custom_properties:
        broker.rack: dc2
        replica.selector.class: org.apache.kafka.common.replica.RackAwareReplicaSelector
