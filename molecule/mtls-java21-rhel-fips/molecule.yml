---
### Installation of Confluent Platform on Alma Linux 9.
### MTLS enabled.
### Java 21.
### FIPS enabled

driver:
  name: docker
platforms:
  - name: controller1
    hostname: controller1.confluent
    groups:
      - kafka_controller
    image: almalinux:9-minimal
    dockerfile: ../Dockerfile-rhel-java21.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-broker1
    hostname: kafka-broker1.confluent
    groups:
      - kafka_broker
    image: almalinux:9-minimal
    dockerfile: ../Dockerfile-rhel-java21.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: schema-registry1
    hostname: schema-registry1.confluent
    groups:
      - schema_registry
    image: almalinux:9-minimal
    dockerfile: ../Dockerfile-rhel-java21.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-rest1
    hostname: kafka-rest1.confluent
    groups:
      - kafka_rest
    image: almalinux:9-minimal
    dockerfile: ../Dockerfile-rhel-java21.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-connect1
    hostname: kafka-connect1.confluent
    groups:
      - kafka_connect
    image: almalinux:9-minimal
    dockerfile: ../Dockerfile-rhel-java21.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: ksql1
    hostname: ksql1.confluent
    groups:
      - ksql
    image: almalinux:9-minimal
    dockerfile: ../Dockerfile-rhel-java21.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: control-center-next-gen
    hostname: control-center-next-gen.confluent
    groups:
      - control_center_next_gen
    image: almalinux:9-minimal
    dockerfile: ../Dockerfile-rhel-java21.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    published_ports:
      - "9021:9021"
    networks:
      - name: confluent
  # External Prometheus: prebuilt mock external Prometheus (cp-ansible-tools/docker/byop-mock-prometheus), Basic auth over TLS.
  - name: external-prometheus
    hostname: external-prometheus.confluent
    groups:
      - external_prometheus
    image: byop-mock-prometheus:latest
    pre_build_image: true
    command: "--config.file=/etc/prometheus/prometheus.yml --web.config.file=/etc/prometheus/web-config-basic.yml --web.enable-otlp-receiver --storage.tsdb.path=/prometheus"
    networks:
      - name: confluent
provisioner:
  playbooks:
    converge: ../collections_converge.yml
  inventory:
    host_vars:
      # External Prometheus mock has no Python; treat it as an unmanaged appliance (no connect, no facts).
      external-prometheus:
        ansible_connection: local
        gather_facts: false
    group_vars:
      all:

        # Archive (local tarball) installation. Tarballs are staged into the
        # scenario directory on the control node by cp-ansible-tools; remote:false
        # copies them into each container and expands at archive_destination_path.
        installation_method: archive
        confluent_archive_file_source: "{{ lookup('env', 'MOLECULE_SCENARIO_DIRECTORY') }}/confluent{{ '' if confluent_server_enabled else '-community' }}-{{ confluent_package_version }}.tar.gz"
        confluent_archive_file_remote: false
        confluent_archive_control_center_next_gen_file_source: "{{ lookup('env', 'MOLECULE_SCENARIO_DIRECTORY') }}/confluent-control-center-next-gen-{{ confluent_control_center_next_gen_package_version }}.tar.gz"
        confluent_archive_control_center_next_gen_file_remote: false
        confluent_archive_usm_agent_file_source: "{{ lookup('env', 'MOLECULE_SCENARIO_DIRECTORY') }}/confluent-usm-agent-{{ confluent_usm_agent_full_package_version }}.tar.gz"
        confluent_archive_usm_agent_file_remote: false
        ssl_enabled: true
        ssl_mutual_auth_enabled: true

        # External Prometheus: read from the external mock Prometheus over TLS + basic auth.
        control_center_next_gen_external_prometheus_enabled: true
        control_center_next_gen_dependency_prometheus_host: external-prometheus.confluent
        control_center_next_gen_dependency_prometheus_port: 9090
        control_center_next_gen_dependency_prometheus_ssl_enabled: true
        control_center_next_gen_dependency_prometheus_basic_auth_enabled: true
        control_center_next_gen_dependency_prometheus_ca_cert_path: /var/ssl/private/external_prometheus_ca.crt
        # External Prometheus: controller-side source of the mock CA, imported into broker/controller truststores
        # so the telemetry exporter trusts the external Prometheus over TLS.
        control_center_next_gen_dependency_prometheus_provided_ca_cert_path: "{{ lookup('env', 'BYOP_CERTS_DIR') | default('/tmp/byop-mock-prometheus/certs', true) }}/ca.crt"
        control_center_next_gen_dependency_prometheus_basic_users:
          admin:
            principal: c3
            password: c3-prometheus-secret

        redhat_java_package_name: java-21-openjdk

        fips_enabled: true
        fips_mode: "fips-140-3"
