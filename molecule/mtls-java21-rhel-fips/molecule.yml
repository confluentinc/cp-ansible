---
### Installation of Confluent Platform on Alma Linux 9.
### MTLS enabled.
### Java 21.
### FIPS enabled

driver:
  name: docker
platforms:
  - name: controller1
    hostname: controller1.confluent
    groups:
      - kafka_controller
    image: almalinux:9-minimal
    dockerfile: ../Dockerfile-rhel-java21.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-broker1
    hostname: kafka-broker1.confluent
    groups:
      - kafka_broker
    image: almalinux:9-minimal
    dockerfile: ../Dockerfile-rhel-java21.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: schema-registry1
    hostname: schema-registry1.confluent
    groups:
      - schema_registry
    image: almalinux:9-minimal
    dockerfile: ../Dockerfile-rhel-java21.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-rest1
    hostname: kafka-rest1.confluent
    groups:
      - kafka_rest
    image: almalinux:9-minimal
    dockerfile: ../Dockerfile-rhel-java21.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-connect1
    hostname: kafka-connect1.confluent
    groups:
      - kafka_connect
    image: almalinux:9-minimal
    dockerfile: ../Dockerfile-rhel-java21.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: ksql1
    hostname: ksql1.confluent
    groups:
      - ksql
    image: almalinux:9-minimal
    dockerfile: ../Dockerfile-rhel-java21.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: control-center-next-gen
    hostname: control-center-next-gen.confluent
    groups:
      - control_center_next_gen
    image: almalinux:9-minimal
    dockerfile: ../Dockerfile-rhel-java21.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    published_ports:
      - "9021:9021"
    networks:
      - name: confluent
  # External Prometheus: prebuilt mock external Prometheus (cp-ansible-tools/docker/byop-mock-prometheus), Basic auth over TLS.
  - name: external-prometheus
    hostname: external-prometheus.confluent
    groups:
      - external_prometheus
    image: byop-mock-prometheus:latest
    pre_build_image: true
    command: "--config.file=/etc/prometheus/prometheus.yml --web.config.file=/etc/prometheus/web-config-basic.yml --web.enable-otlp-receiver --storage.tsdb.path=/prometheus"
    networks:
      - name: confluent
provisioner:
  playbooks:
    converge: ../collections_converge.yml
  inventory:
    host_vars:
      # External Prometheus mock has no Python; treat it as an unmanaged appliance (no connect, no facts).
      external-prometheus:
        ansible_connection: local
        gather_facts: false
    group_vars:
      all:

        ssl_enabled: true
        ssl_mutual_auth_enabled: true

        # External Prometheus needs C3 Next Gen newer than 2.6 (same check as validate_external_prometheus.yml).
        # With an older C3 the scenario falls back to the bundled Prometheus over plain HTTP.
        external_prometheus_c3_supported: "{{ (confluent_control_center_next_gen_package_version | default('0.0') | regex_replace('^([0-9]+)\\.([0-9]+).*', '\\1.\\2')) is version('2.6', '>') }}"
        # External Prometheus: read from the external mock Prometheus over TLS + basic auth.
        control_center_next_gen_external_prometheus_enabled: "{{ external_prometheus_c3_supported }}"
        control_center_next_gen_dependency_prometheus_host: "{{ 'external-prometheus.confluent' if external_prometheus_c3_supported else ((groups.get('control_center_next_gen') if groups.get('control_center_next_gen') else ['localhost']) | confluent.platform.resolve_hostnames(hostvars) | first) }}"
        control_center_next_gen_dependency_prometheus_port: 9090
        control_center_next_gen_dependency_prometheus_ssl_enabled: "{{ external_prometheus_c3_supported }}"
        control_center_next_gen_dependency_prometheus_basic_auth_enabled: "{{ external_prometheus_c3_supported }}"
        control_center_next_gen_dependency_prometheus_ca_cert_path: "{{ '/var/ssl/private/external_prometheus_ca.crt' if external_prometheus_c3_supported else ssl_file_dir_final ~ '/ca.crt' }}"
        # External Prometheus: controller-side source of the mock CA, imported into broker/controller truststores
        # so the telemetry exporter trusts the external Prometheus over TLS.
        control_center_next_gen_dependency_prometheus_provided_ca_cert_path: "{{ (lookup('env', 'BYOP_CERTS_DIR') | default('/tmp/byop-mock-prometheus/certs', true) ~ '/ca.crt') if external_prometheus_c3_supported else '' }}"
        control_center_next_gen_dependency_prometheus_basic_users:
          admin:
            principal: c3
            password: c3-prometheus-secret

        redhat_java_package_name: java-21-openjdk

        fips_enabled: true
        fips_mode: "fips-140-3"
