---
### Simulates linking an on prem cluster to Confluent Cloud on RHEL8.
### TLS Enabled.
### SASL Plain Enabled.
### Schema Registry uses Basic Auth.

driver:
  name: docker
platforms:
  - name: controller1
    hostname: controller1.confluent
    groups:
      - kafka_controller
    image: redhat/ubi10-minimal
    dockerfile: ../Dockerfile-rhel-java25.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-broker1
    hostname: kafka-broker1.confluent
    groups:
      - kafka_broker
    image: redhat/ubi10-minimal
    dockerfile: ../Dockerfile-rhel-java25.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-broker2
    hostname: kafka-broker2.confluent
    groups:
      - kafka_broker
    image: redhat/ubi10-minimal
    dockerfile: ../Dockerfile-rhel-java25.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-broker3
    hostname: kafka-broker3.confluent
    groups:
      - kafka_broker
    image: redhat/ubi10-minimal
    dockerfile: ../Dockerfile-rhel-java25.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: ccloud-schema-registry1
    hostname: ccloud-schema-registry1.confluent
    groups:
      - ccloud_schema_registry
    image: redhat/ubi10-minimal
    dockerfile: ../Dockerfile-rhel-java25.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: schema-registry1
    hostname: schema-registry1.confluent
    groups:
      - schema_registry
    image: redhat/ubi10-minimal
    dockerfile: ../Dockerfile-rhel-java25.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-connect1
    hostname: kafka-connect1.confluent
    groups:
      - kafka_connect
    image: redhat/ubi10-minimal
    dockerfile: ../Dockerfile-rhel-java25.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: ksql1
    hostname: ksql1.confluent
    groups:
      - ksql
    image: redhat/ubi10-minimal
    dockerfile: ../Dockerfile-rhel-java25.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-rest1
    hostname: kafka-rest1.confluent
    groups:
      - kafka_rest
    image: redhat/ubi10-minimal
    dockerfile: ../Dockerfile-rhel-java25.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: control-center-next-gen
    hostname: control-center-next-gen.confluent
    groups:
      - control_center_next_gen
    image: redhat/ubi10-minimal
    dockerfile: ../Dockerfile-rhel-java25.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    published_ports:
      - "9022:9022"
    networks:
      - name: confluent
  - name: usm-agent1
    hostname: usm-agent1.confluent
    groups:
      - usm_agent
    image: redhat/ubi10-minimal
    dockerfile: ../Dockerfile-rhel-java25.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: ccloud-mock-service
    hostname: ccloud-mock-service.confluent
    groups:
      - ccloud_mock
    image: usmagent-mock-ccloud:latest
    pre_build_image: true
    command: ""
    published_ports:
      - "8081:8081"
    networks:
      - name: confluent
    env:
      MOCK_SERVER_HOST: "0.0.0.0"
      MOCK_SERVER_PORT: "8081"
      MOCK_SERVER_USE_TLS: "false"
      MOCK_SERVER_REQUIRE_BASIC_AUTH: "true"
      MOCK_SERVER_USERNAME: "ccloud-user"
      MOCK_SERVER_PASSWORD: "ccloud-secret"
      MOCK_SERVER_REQUIRE_MTLS: "false"
provisioner:
  playbooks:
    converge: converge.yml
  inventory:
    host_vars:
      ccloud-mock-service:
        ansible_connection: local
        gather_facts: false
      usm-agent1:
        usm_agent_custom_properties:
          confluent.usm-agent.ccloud.ssl.enabled: "false"
        usm_agent_health_check_enabled: false
        usm_agent_ssl_enabled: false
        usm_agent_ssl_mutual_auth_enabled: false
        ccloud_endpoint: http://ccloud-mock-service:8081
        ccloud_environment_id: env-mock-123
        ccloud_credential:
          username: ccloud-user
          password: ccloud-secret
        usm_agent_command_handler_connect_clusters:
          cloud-connect:
            url: https://kafka-connect1:8083
            group_id: connect-cluster
            autogen_ca: true
      # Mocked out CCloud SR cluster
      ccloud-schema-registry1:
        ssl_enabled: true

        schema_registry_authentication_type: basic

        sasl_protocol: plain
        ccloud_kafka_enabled: false

    group_vars:
      # Mocked out CCloud Kafka Cluster
      kafka_broker:
        ssl_enabled: true
        sasl_protocol: plain

        # This var messes with the sasl plain users
        ccloud_kafka_enabled: false
      kafka_controller:
        ssl_enabled: true
        sasl_protocol: plain

      all:
        control_center_next_gen_port: 9022
        control_center_next_gen_dependency_prometheus_ssl_enabled: true
        control_center_next_gen_dependency_prometheus_basic_auth_enabled: true
        control_center_next_gen_dependency_alertmanager_ssl_enabled: true
        control_center_next_gen_dependency_alertmanager_basic_auth_enabled: true

        scenario_name: ccloud

        ssl_enabled: true

        # Not validating ksql truststore logic, tested manually
        ksql_ssl_enabled: false

        # In prepare playbook kafka's CA gets inserted into the default java truststore
        # Then during converge, a new ca will be created/ used for the rest api certs
        regenerate_ca: true

        ccloud_kafka_enabled: true
        ccloud_kafka_bootstrap_servers: kafka-broker1:9092
        ccloud_kafka_key: client
        ccloud_kafka_secret: client-secret

        ccloud_schema_registry_enabled: true
        ccloud_schema_registry_url: https://ccloud-schema-registry1:8081
        ccloud_schema_registry_key: admin
        ccloud_schema_registry_secret: admin-secret
