---
### Rootless install of Confluent Platform Cluster on Debian9.
### RBAC enabled. SASL PLAIN enabled. TLS with custom certs enabled.
### Kafka Broker Custom Listener. Secrets protection enabled.
### Control Center disabled, metrics reporters enabled.
### LdapAuthenticateCallbackHandler for AuthN.
### Creates two unique Connectors in Connect cluster.
###
### Converted from the former (root) rbac-plain-provided-debian9 scenario to also cover
### rootless - KRaft-only (no ZK toggle, no migration groups): ZK has zero rootless support
### of its own, so a scenario that's rootless can't also support ZK/migration testing. See
### PR_2602_REVIEW_TRACKING.md for the rationale (avoid a separate, always-growing set of
### dedicated rootless-only scenarios; convert existing coverage in place instead).
###
### TODO: this scenario's original ZK toggle (${KRAFT_CONTROLLER:-zookeeper}) and migration-group
### coverage were dropped here, not preserved elsewhere - once rootless_enabled supports Zookeeper
### (it doesn't today; see the "Fail fast - rootless does not support Zookeeper" assert in
### roles/common/tasks/config_validations.yml), restore the toggle here so this scenario can cover
### both modes again instead of being permanently KRaft-only.
###
### Known container limitations (not fixable here, called out for reviewers):
### - privileged: true + cgroupns_mode: host is required for systemd --user to run inside
###   Docker at all - it does NOT mean the deploy itself used root. That's verified instead
###   by asserting every file under rootless_deployment_path is owned by deployment_user (verify.yml)
###   and by the extensive live-EC2 (non-containerized) verification recorded in
###   ROOTLESS_DEPLOYMENT_STEPS.md.
### - loginctl enable-linger surviving an actual host reboot is a design promise that isn't
###   exercisable in a container (no real reboot) - also only verified live on EC2.

driver:
  name: docker
platforms:
  - name: ldap1
    hostname: ldap1.confluent
    groups:
      - ldap_server
    image: centos:centos8
    dockerfile: ../Dockerfile-centos8-base.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-controller1
    hostname: kafka-controller1.confluent
    groups:
