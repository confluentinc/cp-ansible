---
### certificates.yml connects to kafka_broker[0] to generate custom certs - this runs
### before rootless_bootstrap ever creates the deploy user, so it must connect as root
### (the container's only user at this point), not the deployment_user group_vars/all
### normally resolves ansible_user to. Same shim converge.yml uses for the same reason.
- name: Cache ansible_user=root so certificates.yml connects as root (deploy user doesn't exist yet)
  hosts: kafka_broker
  gather_facts: false
  vars:
    ansible_user: root
  tasks:
    - set_fact:
        ansible_user: root

- name: Create Custom Certs
  import_playbook: ../certificates.yml

- name: Provision LDAP Server
  import_playbook: ../ldap.yml

- name: Install Zookeeper Cluster
  import_playbook: confluent.platform.all
  when: lookup('env', 'MIGRATION')|default('false') == 'true'
