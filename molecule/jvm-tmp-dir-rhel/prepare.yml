---
- name: Configure IPv6 Preference
  import_playbook: ../configure_ipv6.yml

- name: Create deploy_tmp_dir (cp-ansible does not create it)
  hosts: all
  gather_facts: false
  tasks:
    - name: Create /var/tmp/cp-deploy
      file:
        path: /var/tmp/cp-deploy
        state: directory
        mode: '1777'
