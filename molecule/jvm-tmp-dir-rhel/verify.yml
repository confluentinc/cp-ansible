---
### Validates java.io.tmpdir is set to jvm_tmp_dir/<role> for each service, the directory exists with
### the service user as owner, and no cp-ansible staging files were left in /tmp or deploy_tmp_dir.

- name: Verify - jvm_tmp_dir applied
  hosts: all
  gather_facts: false
  vars:
    role_for_group:
      zookeeper: zookeeper
      kafka_controller: kafka_controller
      kafka_broker: kafka_broker
      kafka_connect: kafka_connect
      ksql: ksql
      control_center: control_center
  tasks:
    - import_role:
        name: variables

    - name: Resolve role for host
      set_fact:
        tmp_role: "{{ group_names | intersect(role_for_group.keys() | list) | first }}"

    - name: Find service override.conf
      find:
        paths: /etc/systemd/system
        patterns: override.conf
        recurse: true
      register: override_files

    - name: Read override files
      slurp:
        src: "{{ item.path }}"
      loop: "{{ override_files.files }}"
      register: override_contents

    - name: Assert java.io.tmpdir is set in the service environment
      assert:
        that:
          - override_contents.results | map(attribute='content') | map('b64decode') | join('\n') is search('-Djava.io.tmpdir=/var/tmp/cp-jvm/' + tmp_role)

    - name: Stat JVM temp dir
      stat:
        path: "/var/tmp/cp-jvm/{{ tmp_role }}"
      register: jvm_dir

    - name: Assert JVM temp dir exists, owned by the service user
      assert:
        that:
          - jvm_dir.stat.exists
          - jvm_dir.stat.isdir
          - jvm_dir.stat.pw_name == lookup('vars', tmp_role + '_user')

    - name: Check no staging files left behind
      find:
        paths:
          - /tmp
          - /var/tmp/cp-deploy
        patterns: "passphrase.txt,security.properties,masterkey,oauth_idp_cert.pem,sso_idp_cert.pem"
      register: leftovers

    - name: Assert no staging files left behind
      assert:
        that: leftovers.matched == 0

- name: Verify - ksql rocksdb under jvm_tmp_dir
  hosts: ksql
  gather_facts: false
  tasks:
    - name: Stat rocksdb dir
      stat:
        path: /var/tmp/cp-jvm/ksqldb
      register: rocksdb_dir

    - name: Assert rocksdb dir moved off /tmp
      assert:
        that: rocksdb_dir.stat.exists
