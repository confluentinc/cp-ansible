---
- name: Check That Dynamic Config Is Rejected on a Static Cluster
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Apply Dynamic Quorum Config Without Migrating
      command: >-
        ansible-playbook
        -i {{ lookup('env', 'MOLECULE_INVENTORY_FILE') }}
        confluent.platform.kafka_controller
        --tags validate_dynamic_quorum_configs
      args:
        chdir: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      environment:
        ANSIBLE_COLLECTIONS_PATH: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | dirname | dirname | dirname }}:{{ lookup('env', 'HOME') }}/.ansible/collections:/usr/share/ansible/collections"
        ANSIBLE_STDOUT_CALLBACK: ansible.builtin.default
        ANSIBLE_FORCE_COLOR: "0"
        ANSIBLE_NOCOLOR: "1"
      register: qm_guard
      changed_when: false
      failed_when: >-
        qm_guard.rc == 0
        or 'StaticToDynamicQuorumMigration' not in qm_guard.stdout

- name: Migrate Static KRaft Cluster to Dynamic Quorum
  import_playbook: confluent.platform.StaticToDynamicQuorumMigration
