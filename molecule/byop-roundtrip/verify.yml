---
# Round-trip ends on BUNDLED: assert the bundled Prometheus is reinstalled and C3 no longer carries
# the external.enable flag.
- name: Verify round-trip ended on the bundled Prometheus
  hosts: control_center_next_gen
  gather_facts: false
  become: true
  tasks:
    - name: List installed service units
      ansible.builtin.command: systemctl list-unit-files --type=service --no-legend
      register: rt_after
      changed_when: false
    - name: Assert the bundled Prometheus is back after the round-trip
      ansible.builtin.assert:
        that: ["'prometheus.service' in rt_after.stdout"]
        fail_msg: "Round-trip back to bundled did not reinstall the Prometheus service."
