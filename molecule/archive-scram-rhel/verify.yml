---
### Validates that customer user and group on archive are set.
### Validates that SASL SCRAM is Protocol is set.
### Validates that TLS is configured properly.

# BYOP: run these first so they execute on the C3 host before any scenario-specific play can mark
# that host failed (a failed host is skipped by every later play). Bundle absent, C3 reads the
# external Prometheus (Basic auth), alerts off, nodes pushing.
- import_playbook: ../byop_verify.yml

- name: Verify
  hosts: all,!ccloud-mock-service,!byop-prometheus
  gather_facts: false
  tasks:
    - import_role:
        name: variables

    - name: Get stats on copied file
      stat:
        path: "/opt/confluent/confluent-{{confluent_package_version}}"
      register: archive

    - name: Assert copied file's permissions correct
      assert:
        that:
          - archive.stat.exists
          - archive.stat.gr_name == 'custom'
          - archive.stat.pw_name == 'cp-custom'
        quiet: true

- name: Verify - USM Agent Functionality
  import_playbook: ../verify_usm_agent.yml

- name: Verify - kafka_controller
  hosts: kafka_controller
  gather_facts: false
  tasks:
    - import_role:
        name: variables
    - import_role:
        name: confluent.test
        tasks_from: check_subproperty.yml
      vars:
        file_path: /opt/confluent/etc/controller/server.properties
        property: sasl.enabled.mechanisms
        expected_values:
          - SCRAM-SHA-256
          - PLAIN
    - import_role:
        name: confluent.test
        tasks_from: check_property.yml
      vars:
        file_path: /opt/confluent/etc/controller/server.properties
        property: sasl.mechanism.controller.protocol
        expected_value: PLAIN

- name: Verify - kafka_broker
  hosts: kafka_broker
  gather_facts: false
  tasks:
    - import_role:
        name: confluent.test
        tasks_from: check_property.yml
      vars:
        file_path: /opt/confluent/etc/kafka/server.properties
        property: sasl.mechanism.controller.protocol
        expected_value: SCRAM-SHA-256

- name: Verify - kafka_connect
  hosts: kafka_connect
  gather_facts: false
  tasks:
    - import_role:
        name: variables

    - import_role:
        name: confluent.test
        tasks_from: check_property.yml
      vars:
        file_path: /opt/confluent/etc/kafka/connect-distributed.properties
        property: plugin.path
        expected_value: "/opt/confluent/confluent-{{confluent_package_version}}/share/java/connect_plugins,/usr/share/java/connect_plugins"

- name: Verify - kafka_broker
  hosts: kafka_broker
  gather_facts: false
  tasks:
    - import_role:
        name: confluent.test
        tasks_from: check_property.yml
      vars:
        file_path: /opt/confluent/etc/kafka/server.properties
        property: log.dirs
        expected_value: /tmp/logs1,/tmp/logs2
