---
### External Prometheus: greenfield, external Prometheus over mTLS, on an explicitly SELF-SIGNED cluster.
### Regression for the keytool overwrite-prompt hang: with a literal self_signed=true (as external
### config generators emit), the SSL role's self_signed builder AND the provided-client-cert custom
### builder both run on the same C3->Prometheus keystore/alias, so keytool -importkeystore blocks on
### an interactive overwrite prompt. The sibling external-prometheus-mtls-ubuntu scenario leaves
### self_signed at its lazy default, which flips to false inside the provided-cert include (ssl_custom_certs
### =true) and so never reproduces this. The fix (self_signed=false on that include) must keep this green.
### Focused cluster (controller + broker + C3 + mock Prometheus) - enough to prove C3 reads the
### external Prometheus over mTLS, the nodes push to it, and no bundled monitoring is installed.
### NEEDS A MOLECULE RUN TO CONFIRM: the mTLS client-cert trust chain (C3's client cert, signed by
### the mock CA, accepted by the mock's client_ca) is the part that only a live run validates.

driver:
  name: docker
platforms:
  - name: controller1
    hostname: controller1.confluent
    groups:
      - kafka_controller
    image: geerlingguy/docker-ubuntu2404-ansible
    dockerfile: ../Dockerfile-ubuntu-java25-lean.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-broker1
    hostname: kafka-broker1.confluent
    groups:
      - kafka_broker
    image: geerlingguy/docker-ubuntu2404-ansible
    dockerfile: ../Dockerfile-ubuntu-java25-lean.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: control-center-next-gen
    hostname: control-center-next-gen.confluent
    groups:
      - control_center_next_gen
    image: geerlingguy/docker-ubuntu2404-ansible
    dockerfile: ../Dockerfile-ubuntu-java25-lean.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    published_ports:
      - "9022:9022"
    networks:
      - name: confluent
  # External Prometheus: prebuilt mock external Prometheus, mTLS (web-config-mtls.yml requires a client cert).
  - name: external-prometheus
    hostname: external-prometheus.confluent
    groups:
      - external_prometheus
    image: byop-mock-prometheus:latest
    pre_build_image: true
    command: "--config.file=/etc/prometheus/prometheus.yml --web.config.file=/etc/prometheus/web-config-mtls.yml --web.enable-otlp-receiver --storage.tsdb.path=/prometheus"
    networks:
      - name: confluent
provisioner:
  playbooks:
    converge: ../collections_converge.yml
  inventory:
    host_vars:
      external-prometheus:
        ansible_connection: local
        gather_facts: false
      kafka-broker1:
        node_id: 300
    group_vars:
      all:
        control_center_next_gen_port: 9022
        # External Prometheus: read from the external mock Prometheus over mTLS (no basic auth).
        control_center_next_gen_external_prometheus_enabled: true
        control_center_next_gen_dependency_prometheus_host: external-prometheus.confluent
        control_center_next_gen_dependency_prometheus_port: 9090
        control_center_next_gen_dependency_prometheus_ssl_enabled: true
        control_center_next_gen_dependency_prometheus_mtls_enabled: true
        control_center_next_gen_dependency_prometheus_basic_auth_enabled: false
        control_center_next_gen_dependency_prometheus_ca_cert_path: /var/ssl/private/external_prometheus_ca.crt
        # Client cert C3 presents to the mock Prometheus (distributed in prepare.yml, signed by the
        # mock CA so the mock's RequireAndVerifyClientCert accepts it).
        control_center_next_gen_dependency_prometheus_cert_path: /var/ssl/private/external_prometheus_client.crt
        control_center_next_gen_dependency_prometheus_key_path: /var/ssl/private/external_prometheus_client.key
        # Source for building C3's Prometheus client keystore: the mock CA/client cert staged on the
        # controller (BYOP_CERTS_DIR). The ssl role copies these to the *_cert_path above; they must
        # be a different location than the destination (the ssl role deletes the destination first).
        control_center_next_gen_dependency_prometheus_provided_certs_remote_src: false
        control_center_next_gen_dependency_prometheus_provided_ca_cert_path: "{{ lookup('env', 'BYOP_CERTS_DIR') | default('/tmp/byop-mock-prometheus/certs', true) }}/ca.crt"
        control_center_next_gen_dependency_prometheus_provided_cert_path: "{{ lookup('env', 'BYOP_CERTS_DIR') | default('/tmp/byop-mock-prometheus/certs', true) }}/client.crt"
        control_center_next_gen_dependency_prometheus_provided_key_path: "{{ lookup('env', 'BYOP_CERTS_DIR') | default('/tmp/byop-mock-prometheus/certs', true) }}/client.key"
        ssl_enabled: true
        ssl_mutual_auth_enabled: true
        # Explicit literal self_signed (NOT the lazy default): forces the self_signed cert builder to
        # run cluster-wide, so the C3 provided-client-cert include collides unless the fix sets
        # self_signed=false there. This is what reproduces the keytool overwrite-prompt hang.
        self_signed: true
        kafka_broker_custom_properties:
          log.dirs: /var/lib/kafka/data1
