---
- name: Cache ansible_user=root so a rootless bootstrap can run before the deploy user exists
  hosts: all
  gather_facts: false
  tasks:
    - set_fact:
        ansible_user: root
      when: (deployment_user | default('') | length > 0) and (rootless_deployment_path | default('') | length > 0)

- import_playbook: confluent.platform.rootless_bootstrap

- name: Cache ansible_user=deployment_user so the unprivileged deploy connects as that user
  hosts: all
  gather_facts: false
  tasks:
    - set_fact:
        ansible_user: "{{ deployment_user }}"
      when: (deployment_user | default('') | length > 0) and (rootless_deployment_path | default('') | length > 0)

- import_playbook: confluent.platform.all
