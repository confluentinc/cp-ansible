---
### Rootless install of Confluent Platform on RHEL9.
### Kerberos enabled with custom client config path.
### Creates a Connector in Connect cluster.
###
### Converted from the former (root) kerberos-rhel scenario to also cover rootless -
### KRaft-only (no ZK toggle, no migration groups): ZK has zero rootless support of its own,
### so a scenario that's rootless can't also support ZK/migration testing. Kept the 3-broker
### topology (dropped only the migration-specific groups/hosts) since it's real, valuable
### coverage on its own, independent of rootless. See PR_2602_REVIEW_TRACKING.md for the
### rationale (avoid a separate, always-growing set of dedicated rootless-only scenarios;
### convert existing coverage in place instead).
###
### TODO: this scenario's original ZK toggle (${KRAFT_CONTROLLER:-zookeeper}) and migration-group
### coverage were dropped here, not preserved elsewhere - once rootless_enabled supports Zookeeper
### (it doesn't today; see the "Fail fast - rootless does not support Zookeeper" assert in
### roles/common/tasks/config_validations.yml), restore the toggle here so this scenario can cover
### both modes again instead of being permanently KRaft-only.
###
### Known container limitations (not fixable here, called out for reviewers):
### - privileged: true + cgroupns_mode: host is required for systemd --user to run inside
###   Docker at all - it does NOT mean the deploy itself used root. That's verified instead
###   by asserting every file under rootless_deployment_path is owned by deployment_user (verify.yml)
###   and by the extensive live-EC2 (non-containerized) verification recorded in
###   ROOTLESS_DEPLOYMENT_STEPS.md.
### - loginctl enable-linger surviving an actual host reboot is a design promise that isn't
###   exercisable in a container (no real reboot) - also only verified live on EC2.

driver:
  name: docker
platforms:
  - name: kerberos1
    hostname: kerberos1.confluent
    groups:
      - kerberos_server
    image: centos:centos8
    dockerfile: ../Dockerfile-centos8-base.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-controller1
    hostname: kafka-controller1.confluent
    groups:
      - kafka_controller
    image: redhat/ubi9-minimal
    dockerfile: ../Dockerfile-rhel-java8.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-broker1
    hostname: kafka-broker1.confluent
    groups:
      - kafka_broker
    image: redhat/ubi9-minimal
    dockerfile: ../Dockerfile-rhel-java8.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-broker2
    hostname: kafka-broker2.confluent
    groups:
      - kafka_broker
    image: redhat/ubi9-minimal
    dockerfile: ../Dockerfile-rhel-java8.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-broker3
    hostname: kafka-broker3.confluent
    groups:
      - kafka_broker
    image: redhat/ubi9-minimal
    dockerfile: ../Dockerfile-rhel-java8.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: schema-registry1
    hostname: schema-registry1.confluent
    groups:
      - schema_registry
    image: redhat/ubi9-minimal
    dockerfile: ../Dockerfile-rhel-java8.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-rest1
    hostname: kafka-rest1.confluent
    groups:
      - kafka_rest
    image: redhat/ubi9-minimal
    dockerfile: ../Dockerfile-rhel-java8.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-connect1
    hostname: kafka-connect1.confluent
    groups:
      - kafka_connect
    image: redhat/ubi9-minimal
    dockerfile: ../Dockerfile-rhel-java8.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: ksql1
    hostname: ksql1.confluent
    groups:
      - ksql
    image: redhat/ubi9-minimal
    dockerfile: ../Dockerfile-rhel-java8.j2
    command: ""
    volumes:
