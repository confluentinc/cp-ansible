---
### deployment_user (cp-user) doesn't exist yet when the IPv6-preference play (implicit
### gather_facts, connects as ansible_user unconditionally) connects here - bootstrap it and
### switch to it first (collections_converge.yml does the same later for the actual deploy).
- name: Cache ansible_user=root so early prepare plays connect as root before the deploy user exists
  hosts: kafka_controller:kafka_broker:schema_registry:kafka_connect:kafka_rest:ksql:control_center_next_gen
  gather_facts: false
  vars:
    ansible_user: root
  tasks:
    - set_fact:
        ansible_user: root

- name: Configure IPv6 Preference
  import_playbook: ../configure_ipv6.yml

- name: Provision Kerberos Server
  import_playbook: ../kerberos.yml

# External Prometheus: distribute the mock Prometheus CA to the hosts that connect to it.
- import_playbook: ../external_prometheus_distribute_ca.yml
