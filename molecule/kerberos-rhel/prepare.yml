---
### deployment_user (cp-user) doesn't exist yet when the IPv6-preference play (implicit
### gather_facts, connects as ansible_user unconditionally) or a MIGRATION=true
### confluent.platform.all run below connect here - bootstrap it and switch to it first
### (converge.yml does the same later).
- name: Cache ansible_user=root so early prepare plays connect as root before the deploy user exists
  hosts: kafka_controller:kafka_controller_migration:zookeeper:zookeeper_migration:kafka_broker:kafka_broker_migration:schema_registry:kafka_connect:kafka_rest:ksql:control_center:control_center_next_gen
  gather_facts: false
  vars:
    ansible_user: root
  tasks:
    - set_fact:
        ansible_user: root

- name: Configure IPv6 Preference
  import_playbook: ../configure_ipv6.yml

- name: Provision Kerberos Server
  import_playbook: ../kerberos.yml

# Bootstrap always runs here (idempotent, converge runs it again) so the deploy user and
# rootless path exist before the externally-managed keytabs are placed.
- import_playbook: confluent.platform.rootless_bootstrap

- name: Place externally-managed keytabs (kerberos_copy_keytab is false, cp-ansible will not copy them)
  hosts: kafka_controller:kafka_controller_migration:zookeeper:zookeeper_migration:kafka_broker:kafka_broker_migration:schema_registry:kafka_connect:kafka_rest:ksql:control_center:control_center_next_gen
  gather_facts: false
  vars:
    ansible_user: root
  tasks:
    - name: Create keytab directory
      ansible.builtin.file:
        path: "{{ rootless_deployment_path | regex_replace('/+$', '') }}/security/keytabs"
        state: directory
        owner: "{{ deployment_user }}"
        group: "{{ deployment_group }}"
        mode: '750'

    # Mode 0400 on purpose: the kerberos role's copy task would set 0640, so verify.yml can tell
    # the keytab was not re-copied.
    - name: Copy keytab (simulates external keytab management)
      ansible.builtin.copy:
        src: "{{ lookup('env', 'MOLECULE_SCENARIO_DIRECTORY') }}/keytabs/{{ item.name }}-{{ inventory_hostname }}.keytab"
        dest: "{{ rootless_deployment_path | regex_replace('/+$', '') }}/security/keytabs/{{ item.name }}.keytab"
        owner: "{{ deployment_user }}"
        group: "{{ deployment_group }}"
        mode: '0400'
      loop: "{{ external_keytab_components | selectattr('group', 'in', group_names) | list }}"

- name: Cache ansible_user=deployment_user so the unprivileged deploy connects as that user
  hosts: kafka_controller:kafka_controller_migration:zookeeper:zookeeper_migration:kafka_broker:kafka_broker_migration:schema_registry:kafka_connect:kafka_rest:ksql:control_center:control_center_next_gen
  gather_facts: false
  tasks:
    - set_fact:
        ansible_user: "{{ deployment_user }}"
      when:
        - lookup('env', 'MIGRATION')|default('false') == 'true'
        - (deployment_user | default('') | length > 0) and (rootless_deployment_path | default('') | length > 0)

- name: Install Zookeeper Cluster
  import_playbook: confluent.platform.all
  when: lookup('env', 'MIGRATION')|default('false') == 'true'
