---
### Validates that Kerberos is enabled across all components.
### Validates that SASL SSL Plaintext is enabled across all components.
### Validates that Connector is running
### Validates the rootless systemd --user lifecycle: nothing ran as root, the deploy user has no
### passwordless-sudo escalation path, nothing landed under /opt beyond the pre-baked JDK, and
### the generated unit/env files point under rootless_deployment_path.

- name: Verify - rootless lifecycle on all CP components
  hosts: kafka_controller:zookeeper:kafka_broker:schema_registry:kafka_connect:kafka_rest:ksql:control_center
  gather_facts: true
  vars:
    rootless_unit_map:
      kafka_controller: cp-kafka_controller.service
      zookeeper: cp-zookeeper.service
      kafka_broker: cp-kafka_broker.service
      schema_registry: cp-schema_registry.service
      kafka_connect: cp-kafka_connect.service
      kafka_rest: cp-kafka_rest.service
      ksql: cp-ksql.service
      control_center: cp-control_center.service
  tasks:
    - name: Determine this host's rootless unit name and component name
      set_fact:
        rootless_unit: "{{ rootless_unit_map[group_names | intersect(rootless_unit_map.keys()) | first] }}"
        rootless_component: "{{ group_names | intersect(rootless_unit_map.keys()) | first }}"

    - name: Check the systemd --user unit is active
      command: "systemctl --user is-active {{ rootless_unit }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"
      register: unit_active
      changed_when: false
      failed_when: unit_active.stdout != "active"

    - name: Check the process is owned by the deploy user, not root
      shell: "ps -eo user,cmd | grep -E 'kafka.Kafka|QuorumPeerMain|SchemaRegistryMain|ConnectDistributed|KafkaRestMain|KsqlServerMain|ControlCenter' | grep -v grep | awk '{print $1}' | sort -u"
      register: process_owners
      changed_when: false

    - name: Assert no process runs as root
      assert:
        that:
          - "'root' not in process_owners.stdout_lines"
          - process_owners.stdout_lines | length > 0
        fail_msg: "Expected all component processes to run as {{ deployment_user }}, found: {{ process_owners.stdout_lines }}"
        quiet: true

    # Re-checked here (not via roles/common/tasks/main.yml's own probe): that task is tagged
    # `notest`, which molecule skips unconditionally.
    - name: Check for non-interactive sudo escalation (rootless)
      command: sudo -n true
      register: rootless_sudo_probe
      changed_when: false
      failed_when: rootless_sudo_probe.rc == 0

    - name: Assert the deploy user has no passwordless-sudo escalation path
      assert:
        that:
          - rootless_sudo_probe.rc != 0
        fail_msg: >-
          '{{ ansible_user }}' has passwordless sudo access to root on this host - this makes the
          rootless proof meaningless (a task missing its rootless_enabled guard would silently
          succeed as root instead of failing loudly). Investigate why this account can escalate.
        quiet: true

    - name: Find everything under rootless_deployment_path
      find:
        paths: "{{ rootless_deployment_path }}"
        recurse: true
        file_type: any
      register: rootless_deployment_path_contents

    - name: Assert everything under rootless_deployment_path is owned by the deploy user, not root
      vars:
        non_deploy_user_files: "{{ rootless_deployment_path_contents.files | rejectattr('pw_name', 'equalto', deployment_user) | map(attribute='path') | list }}"
      assert:
        that:
          - non_deploy_user_files | length == 0
        fail_msg: "Found files under rootless_deployment_path not owned by {{ deployment_user }}: {{ non_deploy_user_files }}"
        quiet: true

    - name: Read the generated systemd --user unit file
      slurp:
        src: "{{ ansible_env.HOME }}/.config/systemd/user/{{ rootless_unit }}"
      register: unit_file_slurp

    - name: Assert the unit's ExecStart/EnvironmentFile point under rootless_deployment_path, not a hardcoded root path
      vars:
        unit_content: "{{ unit_file_slurp.content | b64decode }}"
      assert:
        that:
          - rootless_deployment_path in unit_content
          - ("EnvironmentFile=" ~ rootless_deployment_path) in unit_content
        fail_msg: "cp-{{ rootless_component }} unit file doesn't reference rootless_deployment_path as expected:\n{{ unit_content }}"
        quiet: true

    - name: Read the generated systemd EnvironmentFile
      slurp:
        src: "{{ rootless_deployment_path }}/rootless-bin/{{ rootless_component }}.env"
      register: env_file_slurp

    - name: Assert the EnvironmentFile actually rendered content, not empty or unrendered Jinja
      vars:
        env_content: "{{ env_file_slurp.content | b64decode }}"
        # Built via multiplication so ansible doesn't parse this as the start of an expression.
        unrendered_jinja_marker: "{{ '{' * 2 }}"
      assert:
        that:
          - env_content | trim | length > 0
          - unrendered_jinja_marker not in env_content
        fail_msg: "{{ rootless_component }}.env is empty or has unrendered template syntax:\n{{ env_content }}"
        quiet: true

- name: Verify - zookeeper dataDir under rootless_deployment_path
  hosts: zookeeper
  gather_facts: false
  tasks:
    - import_role:
        name: confluent.test
        tasks_from: check_property.yml
      vars:
        file_path: "{{ rootless_deployment_path }}/confluent/etc/kafka/zookeeper.properties"
        property: dataDir
        expected_value: "{{ rootless_deployment_path }}/data/zookeeper"

- name: Verify - kafka_controller
  hosts: kafka_controller
  gather_facts: false
  tasks:
    - import_role:
        name: variables
    - import_role:
        name: confluent.test
        tasks_from: check_property.yml
      vars:
        file_path: "{{ rootless_deployment_path }}/confluent/etc/controller/server.properties"
        property: controller.quorum.voters
        expected_value: "{{ kafka_controller_quorum_voters }}"
    - import_role:
        name: confluent.test
        tasks_from: check_property.yml
      vars:
        file_path: "{{ rootless_deployment_path }}/confluent/etc/controller/server.properties"
        property: sasl.enabled.mechanisms
        expected_value: GSSAPI
    - import_role:
        name: confluent.test
        tasks_from: check_property.yml
      vars:
        file_path: "{{ rootless_deployment_path }}/confluent/etc/controller/server.properties"
        property: sasl.kerberos.service.name
        expected_value: kafka-a

- name: Verify - kafka_broker
  hosts: kafka_broker
  gather_facts: false
  tasks:
    - import_role:
        name: confluent.test
        tasks_from: check_property.yml
      vars:
        file_path: "{{ rootless_deployment_path }}/confluent/etc/kafka/server.properties"
        property: sasl.enabled.mechanisms
        expected_value: GSSAPI

    - import_role:
        name: confluent.test
        tasks_from: check_property.yml
      vars:
        file_path: "{{ rootless_deployment_path }}/confluent/etc/kafka/server.properties"
        property: sasl.kerberos.service.name
        expected_value: kafka-a

- name: Verify - schema_registry
  hosts: schema_registry
  gather_facts: false
  tasks:
    - import_role:
        name: confluent.test
        tasks_from: check_property.yml
      vars:
        file_path: "{{ rootless_deployment_path }}/confluent/etc/schema-registry/schema-registry.properties"
        property: kafkastore.security.protocol
        expected_value: SASL_PLAINTEXT

    - import_role:
        name: confluent.test
        tasks_from: check_property.yml
      vars:
        file_path: "{{ rootless_deployment_path }}/confluent/etc/schema-registry/schema-registry.properties"
        property: kafkastore.sasl.kerberos.service.name
        expected_value: kafka-a

- name: Verify - kafka_connect
  hosts: kafka_connect
  gather_facts: false
  tasks:
    - import_role:
        name: confluent.test
        tasks_from: check_property.yml
      vars:
        file_path: "{{ rootless_deployment_path }}/confluent/etc/kafka/connect-distributed.properties"
        property: security.protocol
        expected_value: SASL_PLAINTEXT

    - import_role:
        name: confluent.test
        tasks_from: check_property.yml
      vars:
        file_path: "{{ rootless_deployment_path }}/confluent/etc/kafka/connect-distributed.properties"
        property: sasl.kerberos.service.name
        expected_value: kafka-a

    - name: Get Connectors on connect cluster1
      uri:
        url: "http://kafka-connect1:8083/connectors"
        status_code: 200
        validate_certs: false
      register: connectors

    - name: Assert Connector Created
      assert:
        that:
          - connectors.json[0] == "sample-connector-1"
        fail_msg: "Connector not created"
        quiet: true

    - import_role:
        name: variables

    - name: Test data
      set_fact:
        kafka_connect_url: "{{kafka_connect_http_protocol}}://{{ hostvars[inventory_hostname]|confluent.platform.resolve_hostname }}:{{kafka_connect_rest_port}}/connectors"
        reset_all_connectors: []

        add_new_connector:
          - name: test-connector-1
            config:
              connector.class: "FileStreamSourceConnector"
              tasks.max: "1"
              file: "{{ rootless_deployment_path }}/confluent/etc/kafka/connect-distributed.properties"
              topic: "test_topic"

        update_existing_connector:
          - name: test-connector-1
            config:
              connector.class: "FileStreamSourceConnector"
              tasks.max: "5"
              file: "{{ rootless_deployment_path }}/confluent/etc/kafka/connect-distributed.properties"
              topic: "test_topic"

        add_bad_request_connector:
          - name: test-connector-1
            config:
              connector.class: "FileStreamSourceConnector"
              tasks.max: "5"
              file: "{{ rootless_deployment_path }}/confluent/etc/kafka/connect-distributed.properties"
              topic: "test_topic"
          - name: test-connector-2
            config:
              connector.class: "org.apache.kafka.connect.mirror.MirrorHeartbeatConnector"
              tasks.max: "1"
              file: "{{ rootless_deployment_path }}/confluent/etc/kafka/connect-distributed.properties"
              topics: "foo"

        add_non_existent_connector:
          - name: test-connector-1
            config:
              connector.class: "FileStreamSourceConnector"
              tasks.max: "5"
              file: "{{ rootless_deployment_path }}/confluent/etc/kafka/connect-distributed.properties"
              topic: "test_topic"
          - name: test-connector-2
            config:
              connector.class: "io.confluent.connect.jdbc.JdbcSinkConnector"
              tasks.max: "1"
              topics: "foo"

        delete_connector:
          - name: test-connector-2
            config:
              connector.class: "FileStreamSourceConnector"
              tasks.max: "1"
              topic: "bar"

    - import_role:
        name: confluent.test
        tasks_from: check_connector.yml
      vars:
        connect_url_input: "{{ kafka_connect_url }}"
        active_connectors_input: "{{ reset_all_connectors }}"
        expected_message: ""

    - import_role:
        name: confluent.test
        tasks_from: check_connector.yml
      vars:
        connect_url_input: "{{ kafka_connect_url }}"
        active_connectors_input: "{{ add_new_connector }}"
        expected_message: "Connectors added or updated: test-connector-1: new connector added."

    - import_role:
        name: confluent.test
        tasks_from: check_connector.yml
      vars:
        connect_url_input: "{{ kafka_connect_url }}"
        active_connectors_input: "{{ update_existing_connector }}"
        expected_message: "Connectors added or updated: test-connector-1: connector configuration updated."

    - import_role:
        name: confluent.test
        tasks_from: check_connector.yml
      vars:
        connect_url_input: "{{ kafka_connect_url }}"
        active_connectors_input: "{{ add_bad_request_connector }}"
        expected_message: "Connectors added or updated: test-connector-1: no configuration change, test-connector-2: ERROR error while adding new connector configuration (HTTP Error 400: Bad Request)."

    - import_role:
        name: confluent.test
        tasks_from: check_connector.yml
      vars:
        connect_url_input: "{{ kafka_connect_url }}"
        active_connectors_input: "{{ add_non_existent_connector }}"
        expected_message: "Connectors added or updated: test-connector-1: no configuration change, test-connector-2: ERROR error while adding new connector configuration (HTTP Error 500: Internal Server Error)."

    - import_role:
        name: confluent.test
        tasks_from: check_connector.yml
      vars:
        connect_url_input: "{{ kafka_connect_url }}"
        active_connectors_input: "{{ delete_connector }}"
        expected_message: "Connectors removed: test-connector-1. Connectors added or updated: test-connector-2: new connector added."

