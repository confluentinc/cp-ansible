---
### Bootstrap the rootless deploy user + linger (root), then run the normal converge as
### deployment_user. import_playbook takes no inline vars, so these two shim plays flip
### ansible_user via set_fact (which outranks group_vars) around the bootstrap import.
### ldap_server is excluded - it's opted out of rootless entirely in molecule.yml.

- name: Cache ansible_user=root so the imported bootstrap playbook connects as root
  hosts: kafka_controller:kafka_controller_migration:zookeeper:zookeeper_migration:kafka_broker:kafka_broker_migration:schema_registry:schema_registry_migration:kafka_connect:kafka_connect_migration:kafka_rest:kafka_rest_migration:ksql:ksql_migration:control_center:control_center_migration
  gather_facts: false
  vars:
    ansible_user: root
  tasks:
    - set_fact:
        ansible_user: root

- import_playbook: confluent.platform.rootless_bootstrap

- name: Cache ansible_user=deployment_user so the unprivileged deploy connects as that user
  hosts: kafka_controller:kafka_controller_migration:zookeeper:zookeeper_migration:kafka_broker:kafka_broker_migration:schema_registry:schema_registry_migration:kafka_connect:kafka_connect_migration:kafka_rest:kafka_rest_migration:ksql:ksql_migration:control_center:control_center_migration
  gather_facts: false
  vars:
    ansible_user: root
  tasks:
    - set_fact:
        ansible_user: "{{ deployment_user }}"

- import_playbook: "{{ lookup('env', 'MIGRATION_CONVERGE') | default('../collections_converge.yml', true) }}"
