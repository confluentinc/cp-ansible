---
### deployment_user (cp-user) doesn't exist yet when certificates.yml/ldap.yml connect here, so
### they run as root. Same story for the MIGRATION=true confluent.platform.all import below -
### bootstrap it and switch to it first. ldap_server is excluded - it already opts out of
### rootless in molecule.yml.

- name: Cache ansible_user=root so certificates.yml/ldap.yml connect as root before the deploy user exists
  hosts: kafka_controller:kafka_controller_migration:zookeeper:zookeeper_migration:kafka_broker:kafka_broker_migration:schema_registry:schema_registry_migration:kafka_connect:kafka_connect_migration:kafka_rest:kafka_rest_migration:ksql:ksql_migration:control_center:control_center_migration
  gather_facts: false
  vars:
    ansible_user: root
  tasks:
    - set_fact:
        ansible_user: root

- name: Create Custom Certs
  import_playbook: ../certificates.yml

- name: Provision LDAP Server
  import_playbook: ../ldap.yml

- import_playbook: confluent.platform.rootless_bootstrap
  when: lookup('env', 'MIGRATION')|default('false') == 'true'

- name: Cache ansible_user=deployment_user so the unprivileged deploy connects as that user
  hosts: kafka_controller:kafka_controller_migration:zookeeper:zookeeper_migration:kafka_broker:kafka_broker_migration:schema_registry:schema_registry_migration:kafka_connect:kafka_connect_migration:kafka_rest:kafka_rest_migration:ksql:ksql_migration:control_center:control_center_migration
  gather_facts: false
  tasks:
    - set_fact:
        ansible_user: "{{ deployment_user }}"
      when:
        - lookup('env', 'MIGRATION')|default('false') == 'true'
        - (deployment_user | default('') | length > 0) and (rootless_deployment_path | default('') | length > 0)

- name: Install Zookeeper Cluster
  import_playbook: confluent.platform.all
  when: lookup('env', 'MIGRATION')|default('false') == 'true'
