- name: Verify - rootless lifecycle on all CP components
  hosts: kafka_controller:kafka_broker:schema_registry:kafka_connect:kafka_rest:ksql:control_center
  gather_facts: true
  vars:
    rootless_unit_map:
      kafka_controller: cp-kafka_controller.service
      kafka_broker: cp-kafka_broker.service
      schema_registry: cp-schema_registry.service
      kafka_connect: cp-kafka_connect.service
      kafka_rest: cp-kafka_rest.service
      ksql: cp-ksql.service
      control_center: cp-control_center.service
  tasks:
    - name: Determine this host's rootless unit name and component name
      set_fact:
        rootless_unit: "{{ rootless_unit_map[group_names | intersect(rootless_unit_map.keys()) | first] }}"
        rootless_component: "{{ group_names | intersect(rootless_unit_map.keys()) | first }}"

    - name: Check the systemd --user unit is active
      command: "systemctl --user is-active {{ rootless_unit }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"
      register: unit_active
      changed_when: false
      failed_when: unit_active.stdout != "active"

    - name: Check the process is owned by the deploy user, not root
      shell: "ps -eo user,cmd | grep -E 'kafka.Kafka|SchemaRegistryMain|ConnectDistributed|KafkaRestMain|KsqlServerMain|ControlCenter' | grep -v grep | awk '{print $1}' | sort -u"
      register: process_owners
      changed_when: false

    - name: Assert no process runs as root
      assert:
        that:
          - "'root' not in process_owners.stdout_lines"
          - process_owners.stdout_lines | length > 0
        fail_msg: "Expected all component processes to run as {{ deployment_user }}, found: {{ process_owners.stdout_lines }}"
        quiet: true

    - name: Find everything under rootless_deployment_path
      find:
        paths: "{{ rootless_deployment_path }}"
        recurse: true
        file_type: any
      register: rootless_deployment_path_contents

    - name: Assert everything under rootless_deployment_path is owned by the deploy user, not root
      # A privileged test container can docker-exec as root regardless of what the deploy
      # itself did - this, not the container's own privilege level, is what actually proves
      # nothing in the deploy path used root: a root-owned file here means some task silently
      # became root.
      vars:
        non_deploy_user_files: "{{ rootless_deployment_path_contents.files | rejectattr('pw_name', 'equalto', deployment_user) | map(attribute='path') | list }}"
      assert:
        that:
          - non_deploy_user_files | length == 0
        fail_msg: "Found files under rootless_deployment_path not owned by {{ deployment_user }}: {{ non_deploy_user_files }}"
        quiet: true

    - name: Read the generated systemd --user unit file
      slurp:
        src: "{{ ansible_env.HOME }}/.config/systemd/user/{{ rootless_unit }}"
      register: unit_file_slurp

    - name: Assert the unit's ExecStart/EnvironmentFile point under rootless_deployment_path, not a hardcoded root path
      vars:
        unit_content: "{{ unit_file_slurp.content | b64decode }}"
      assert:
        that:
          - rootless_deployment_path in unit_content
          - ("EnvironmentFile=" ~ rootless_deployment_path) in unit_content
        fail_msg: "cp-{{ rootless_component }} unit file doesn't reference rootless_deployment_path as expected:\n{{ unit_content }}"
        quiet: true

    - name: Check nothing was written under /opt
      find:
        paths: /opt
        recurse: true
      register: opt_contents

    - name: Assert nothing exists under /opt
      # Dockerfile-ubuntu.j2 installs Java via `apt-get install openjdk-17-jdk` (real package,
      # standard system location), not a tarball under /opt - so /opt should be completely
      # empty here, not "empty except a pre-baked JDK".
      assert:
        that:
          - opt_contents.files | length == 0
        fail_msg: "Rootless install wrote to /opt, expected nothing there: {{ opt_contents.files | map(attribute='path') | list }}"
        quiet: true
