        property: confluent.controlcenter.streams.ssl.truststore.location
        expected_value: "{{ rootless_deployment_path }}/ssl/control_center.truststore.jks"

- name: Verify - Client Packages
  hosts: kafka_broker
  gather_facts: false
  tasks:
    - import_role:
        name: common
    - shell: grep -Fq "deb {{confluent_clients_repository_baseurl}}/clients/deb/ stretch main" /etc/apt/sources.list
      register: linecheck
      check_mode: false
      changed_when: false
      failed_when: linecheck.rc != 0
