---
### Installs Confluent Platform Cluster on Ubuntu1804.
### RBAC enabled.
### Provided Custom Keystore and Truststore for TLS..
### MTLS enabled.
### Kafka Broker Customer Listener.
### RBAC Additional System Admin.
###
### Runs Zookeeper by default (${KRAFT_CONTROLLER:-zookeeper} unset), KRaft via
### `molecule --env-file molecule/kraft.yml converge -s rbac-mtls-provided-ubuntu` - same toggle
### every other scenario in this repo uses (see docs/HOW_TO_TEST.md). zookeeper_export_certs
### needs no explicit override here - ssl_mutual_auth_enabled: true below already makes
### zookeeper_client_authentication_type default to 'mtls' (roles/variables/defaults/main.yml),
### so zookeeper_export_certs' own default already resolves to True.
###
### Also covers rootless in place (rootless_enabled: true below) - the original ZK<->KRaft
### migration-group coverage (_migration groups, ${MIGRATION_CONVERGE} toggle, controller[1-3]-mig
### hosts) is kept intact. converge.yml runs the rootless bootstrap shim first, then imports
### whichever playbook ${MIGRATION_CONVERGE} resolves to (default ../collections_converge.yml).
### Note: the MIGRATION=true path itself has not been live-verified against rootless_enabled -
### only the toggle's continued presence (not a new regression) is guaranteed here.
###
### Known container limitations (not fixable here, called out for reviewers):
### - privileged: true + cgroupns_mode: host is required for systemd --user to run inside
###   Docker at all - it does NOT mean the deploy itself used root. That's verified instead by:
###   (1) asserting the deploy user has zero passwordless-sudo escalation path, so a task missing
###   its rootless_enabled guard fails loudly instead of silently succeeding as root (verify.yml);
###   (2) asserting every file under rootless_deployment_path is owned by deployment_user
###   (verify.yml); and (3) the extensive live-EC2 (non-containerized) verification recorded in
###   ROOTLESS_DEPLOYMENT_STEPS.md.
### - loginctl enable-linger surviving an actual host reboot is a design promise that isn't
###   exercisable in a container (no real reboot) - also only verified live on EC2.

driver:
  name: docker
platforms:
  - name: ldap1
    hostname: ldap1.confluent
    groups:
      - ldap_server
    image: centos:centos8
    dockerfile: ../Dockerfile-centos8-base.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: ${KRAFT_CONTROLLER:-zookeeper}1
    hostname: ${KRAFT_CONTROLLER:-zookeeper}1.confluent
    groups:
      - ${CONTROLLER_HOSTGROUP:-zookeeper}
      - ${CONTROLLER_HOSTGROUP:-zookeeper}_migration
    image: geerlingguy/docker-ubuntu1804-ansible
    dockerfile: ../Dockerfile-ubuntu.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-broker1
    hostname: kafka-broker1.confluent
    groups:
      - kafka_broker
      - kafka_broker_migration
    image: geerlingguy/docker-ubuntu1804-ansible
