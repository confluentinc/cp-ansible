---
# Converge for the external Prometheus scenarios. External Prometheus needs C3 Next Gen newer than 2.6,
# so with an older C3 nothing is deployed and the scenario is skipped.
- name: External Prometheus - skip the scenario on C3 Next Gen 2.6 and older
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Report the skip
      ansible.builtin.debug:
        msg: >-
          Skipping this scenario: C3 Next Gen {{ confluent_control_center_next_gen_package_version }}
          does not support external Prometheus.
      when: not (external_prometheus_c3_supported | bool)

- import_playbook: collections_converge.yml
  when: external_prometheus_c3_supported | bool
