---
### Rootless install on Ubuntu 20.04, mTLS + RBAC (LDAP-backed MDS) + OAuth/OIDC
### (Keycloak) SSO for Control Center. Validates systemd --user + linger works
### unprivileged, RBAC resolves against LDAP, and rootless_bootstrap.yml's
### apt/dbus-user-session branch on Ubuntu. ldap1 mirrors
### rootless-rbac-ldap-rhel9 (native openldap-servers, CentOS8). oauth1 is the
### same Keycloak container rbac-mds-scram-custom-rhel uses.
###
### Known container limitations (not fixable here, called out for reviewers):
### - privileged: true + cgroupns_mode: host is required for systemd --user to run inside
###   Docker at all - it does NOT mean the deploy itself used root. That's verified instead
###   by asserting every file under rootless_deployment_path is owned by deployment_user (verify.yml)
###   and by the extensive live-EC2 (non-containerized) verification recorded in
###   ROOTLESS_DEPLOYMENT_STEPS.md.
### - loginctl enable-linger surviving an actual host reboot is a design promise that isn't
###   exercisable in a container (no real reboot) - also only verified live on EC2.

driver:
  name: docker
platforms:
  - name: ldap1
    hostname: ldap1.confluent
    groups:
      - ldap_server
    image: centos:centos8
    dockerfile: ../Dockerfile-centos8-base.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: oauth1
    hostname: oauth1.confluent
    groups:
      - oauth_server
    image: quay.io/keycloak/keycloak:latest
    env:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: oauth1
      KC_HTTPS_CERTIFICATE_FILE: /idp-cert.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /idp-key.pem
      KEYCLOAK_HTTP_PORT: "8080"
      KEYCLOAK_HTTPS_PORT: "8443"
    dockerfile: ../Dockerfile-oauth.j2
    published_ports:
      - "8080:8080"
      - "8443:8443"
    command: start-dev
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-controller1
    hostname: kafka-controller1.confluent
    groups:
      - kafka_controller
    image: geerlingguy/docker-ubuntu2004-ansible
    dockerfile: ../Dockerfile-ubuntu2004-archive.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-broker1
    hostname: kafka-broker1.confluent
    groups:
      - kafka_broker
    image: geerlingguy/docker-ubuntu2004-ansible
    dockerfile: ../Dockerfile-ubuntu2004-archive.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: schema-registry1
    hostname: schema-registry1.confluent
    groups:
      - schema_registry
    image: geerlingguy/docker-ubuntu2004-ansible
    dockerfile: ../Dockerfile-ubuntu2004-archive.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-connect1
    hostname: kafka-connect1.confluent
    groups:
      - kafka_connect
    image: geerlingguy/docker-ubuntu2004-ansible
    dockerfile: ../Dockerfile-ubuntu2004-archive.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-rest1
    hostname: kafka-rest1.confluent
    groups:
      - kafka_rest
    image: geerlingguy/docker-ubuntu2004-ansible
    dockerfile: ../Dockerfile-ubuntu2004-archive.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: ksql1
    hostname: ksql1.confluent
    groups:
      - ksql
    image: geerlingguy/docker-ubuntu2004-ansible
    dockerfile: ../Dockerfile-ubuntu2004-archive.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: control-center1
    hostname: control-center1.confluent
    groups:
      - control_center
    image: geerlingguy/docker-ubuntu2004-ansible
    dockerfile: ../Dockerfile-ubuntu2004-archive.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
provisioner:
  playbooks:
    converge: converge.yml
    side_effect: side_effect.yml
    verify: verify.yml
  inventory:
    group_vars:
      all:
        ansible_user: "{{ deployment_user }}"
        rootless_enabled: true
        deployment_user: cp-user
        deployment_group: cp-user
        rootless_deployment_path: /home/cp-user/cp-data
        installation_method: archive
        # Ubuntu's systemd --user manager needs dbus-user-session, which the archive
        # Dockerfile doesn't bake in - exercise rootless_bootstrap.yml's apt branch for it.
        rootless_install_packages: true

        ssl_enabled: true
        ssl_mutual_auth_enabled: true
        ssl_client_authentication: required
        sasl_protocol: none
        rbac_enabled: true

        mds_super_user: mds
        mds_super_user_password: password
        schema_registry_ldap_user: schema-registry1
        schema_registry_ldap_password: password
        kafka_connect_ldap_user: kafka-connect1
        kafka_connect_ldap_password: password
        kafka_rest_ldap_user: kafka-rest1
        kafka_rest_ldap_password: password
        ksql_ldap_user: ksql1
        ksql_ldap_password: password
        control_center_ldap_user: control-center1
        control_center_ldap_password: password

        ldap_base_properties: &ldap_base_properties
          confluent.authorizer.init.timeout.ms: 1800000
          ldap.java.naming.factory.initial: com.sun.jndi.ldap.LdapCtxFactory
          ldap.com.sun.jndi.ldap.read.timeout: 3000
          ldap.java.naming.provider.url: ldap://ldap1:389
          ldap.java.naming.security.principal: uid=mds,OU=rbac,DC=example,DC=com
          ldap.java.naming.security.credentials: password
          ldap.java.naming.security.authentication: simple
          ldap.user.search.base: OU=rbac,DC=example,DC=com
          ldap.group.search.base: OU=rbac,DC=example,DC=com
          ldap.user.name.attribute: uid
          ldap.user.memberof.attribute.pattern: CN=(.*),OU=rbac,DC=example,DC=com
          ldap.group.name.attribute: cn
          ldap.group.member.attribute.pattern: CN=(.*),OU=rbac,DC=example,DC=com
          ldap.user.object.class: account

        kafka_broker_custom_properties: *ldap_base_properties
        kafka_controller_custom_properties: *ldap_base_properties

      # ldap1/oauth1 are unmanaged helper hosts sharing this inventory, not rootless deploy
      # targets - explicitly opt them out of the `all`-level rootless vars above (both the
      # connection override and playbooks/rootless_bootstrap.yml's hosts:all bootstrap sweep,
      # which skips a host when deployment_user/rootless_deployment_path are empty).
      oauth_server:
        ansible_user: root
        deployment_user: ""
        rootless_deployment_path: ""

      # OAuth/OIDC SSO for Control Center, layered on top of the LDAP-backed MDS above.
      # sso_* config is read from roles/kafka_broker/tasks/main.yml (the only consumer in
      # this collection - it imports the IDP cert into the broker's MDS truststore for C3 SSO).
      kafka_broker:
        sso_mode: oidc
        keycloak_oauth_server_port: 8443
        keycloak_http_protocol: https
        sso_groups_claim: groups
        sso_sub_claim: sub
        sso_issuer_url: https://oauth1:8443/realms/cp-ansible-realm
        sso_jwks_uri: https://oauth1:8443/realms/cp-ansible-realm/protocol/openid-connect/certs
        sso_authorize_uri: https://oauth1:8443/realms/cp-ansible-realm/protocol/openid-connect/auth
        sso_token_uri: https://oauth1:8443/realms/cp-ansible-realm/protocol/openid-connect/token
        sso_client_id: control_center
        sso_client_password: my-secret
        sso_idp_cert_path: "{{ lookup('env', 'MOLECULE_SCENARIO_DIRECTORY') }}/ssocertfile.pem"

      # Same DN/schema convention as rootless-rbac-ldap-rhel9 (ou=rbac,dc=example,dc=com).
      # ldap1 is an unmanaged helper host, not a rootless deploy target - explicitly opt it
      # out of the `all`-level rootless vars above (both the connection override and
      # playbooks/rootless_bootstrap.yml's hosts:all sweep, which skips a host when
      # deployment_user/rootless_deployment_path are empty).
      ldap_server:
        ansible_user: root
        deployment_user: ""
        rootless_deployment_path: ""
        ldaps_enabled: false
        ldap_admin_password: ldappassword
        ldap_rbac_group: rbac
        ldap_dc: example
        ldap_dc_extension: com
        ldap_users:
          - username: "{{ mds_super_user }}"
            password: "{{ mds_super_user_password }}"
            uid: 9999
            guid: 99
          - username: "{{ schema_registry_ldap_user }}"
            password: "{{ schema_registry_ldap_password }}"
            uid: 9998
            guid: 98
          - username: "{{ kafka_connect_ldap_user }}"
            password: "{{ kafka_connect_ldap_password }}"
            uid: 9997
            guid: 97
          - username: "{{ kafka_rest_ldap_user }}"
            password: "{{ kafka_rest_ldap_password }}"
            uid: 9996
            guid: 96
          - username: "{{ ksql_ldap_user }}"
            password: "{{ ksql_ldap_password }}"
            uid: 9995
            guid: 95
          - username: "{{ control_center_ldap_user }}"
            password: "{{ control_center_ldap_password }}"
            uid: 9994
            guid: 94

verifier:
  name: ansible
