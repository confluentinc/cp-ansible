---
### Installs Confluent Platform with a dynamic KRaft controller quorum on RHEL.
### Secrets protection enabled.
### Starts with 3 controllers in dc1, adds 3 controllers in dc2 (2DC 3-3),
### then replaces the initial voter after its disk is wiped.

driver:
  name: docker
platforms:
  - name: controller1
    hostname: controller1.confluent
    groups:
      - kafka_controller
    image: redhat/ubi10-minimal
    dockerfile: ../Dockerfile-rhel-java25.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: controller2
    hostname: controller2.confluent
    groups:
      - kafka_controller
    image: redhat/ubi10-minimal
    dockerfile: ../Dockerfile-rhel-java25.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: controller3
    hostname: controller3.confluent
    groups:
      - kafka_controller
    image: redhat/ubi10-minimal
    dockerfile: ../Dockerfile-rhel-java25.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: controller4
    hostname: controller4.confluent
    groups:
      - kafka_controller_dc2
    image: redhat/ubi10-minimal
    dockerfile: ../Dockerfile-rhel-java25.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: controller5
    hostname: controller5.confluent
    groups:
      - kafka_controller_dc2
    image: redhat/ubi10-minimal
    dockerfile: ../Dockerfile-rhel-java25.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: controller6
    hostname: controller6.confluent
    groups:
      - kafka_controller_dc2
    image: redhat/ubi10-minimal
    dockerfile: ../Dockerfile-rhel-java25.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-broker1
    hostname: kafka-broker1.confluent
    groups:
      - kafka_broker
    image: redhat/ubi10-minimal
    dockerfile: ../Dockerfile-rhel-java25.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-broker2
    hostname: kafka-broker2.confluent
    groups:
      - kafka_broker
    image: redhat/ubi10-minimal
    dockerfile: ../Dockerfile-rhel-java25.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
provisioner:
  playbooks:
    converge: converge.yml
  inventory:
    host_vars:
      kafka-broker1:
        kafka_broker_custom_properties:
          broker.rack: dc1
          replica.selector.class: org.apache.kafka.common.replica.RackAwareReplicaSelector
      kafka-broker2:
        kafka_broker_custom_properties:
          broker.rack: dc2
          replica.selector.class: org.apache.kafka.common.replica.RackAwareReplicaSelector
    group_vars:
      all:
        kraft_dynamic_quorum_enabled: true
        kafka_controller_initial_voter: controller1
        secrets_protection_enabled: true
