---
- name: Configure IPv6 Preference
  import_playbook: ../configure_ipv6.yml

- name: Prepare
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - set_fact:
        ansible_os_family: "RedHat"
        ansible_distribution_major_version: 7
    - import_role:
        name: variables
    # The common role defaults are not loaded here, so mirror the version-isolated path segment
    # (CPBR-3912): "/<major.minor>" from the versioned minor line onwards, "" for flat lines.
    - set_fact:
        c3_next_gen_version_segment: "{{ ('/' + confluent_control_center_next_gen_repo_version) if confluent_control_center_next_gen_repo_version is version('2.7', '>=') else '' }}"
        usm_agent_version_segment: "{{ ('/' + confluent_usm_agent_repo_version) if confluent_usm_agent_repo_version is version('1.3', '>=') else '' }}"
    - name: Create custom repo file
      copy:
        dest: "{{ custom_yum_repofile_filepath }}"
        content: |
          [Confluent.custom]
          async = 1
          baseurl = {{confluent_common_repository_baseurl | default(confluent_repository_baseurl)}}/rpm/{{confluent_repo_version}}
          enabled = 1
          gpgcheck = 1
          gpgkey = {{confluent_common_repository_baseurl | default(confluent_repository_baseurl)}}/rpm/{{confluent_repo_version}}/archive.key
          name = Custom Confluent repository
          [Confluent.clients.custom]
          async = 1
          baseurl = https://packages.confluent.io/clients/rpm/centos/{{confluent_common_repository_redhat_release_version}}/x86_64
          enabled = 1
          gpgcheck = 1
          gpgkey = https://packages.confluent.io/clients/rpm/archive.key
          name = Custom Confluent repository (clients)
          [Confluent.custom_control_center_next_gen]
          async = 1
          baseurl = {{confluent_control_center_next_gen_independent_repository_baseurl | default(confluent_repository_baseurl)}}/rpm{{c3_next_gen_version_segment}}
          enabled = 1
          gpgcheck = 1
          gpgkey = {{confluent_control_center_next_gen_independent_repository_baseurl | default(confluent_repository_baseurl)}}/rpm{{c3_next_gen_version_segment}}/archive.key
          name = Custom Confluent Control Center Next Gen repository
          [Confluent.custom_usm_agent]
          async = 1
          baseurl = {{confluent_usm_agent_independent_repository_baseurl | default(confluent_repository_baseurl)}}/rpm{{usm_agent_version_segment}}
          enabled = 1
          gpgcheck = 1
          gpgkey = {{confluent_usm_agent_independent_repository_baseurl | default(confluent_repository_baseurl)}}/rpm{{usm_agent_version_segment}}/archive.key
          name = Custom Confluent USM Agent repository
    - name: Download Jolokia Jar
      get_url:
        url: http://search.maven.org/remotecontent?filepath=org/jolokia/jolokia-jvm/1.6.2/jolokia-jvm-1.6.2-agent.jar
        dest: "{{ jolokia_jar_url }}"
    - name: Download Jmx Exporter Jar
      get_url:
        url: https://repo1.maven.org/maven2/io/prometheus/jmx/jmx_prometheus_javaagent/0.12.0/jmx_prometheus_javaagent-0.12.0.jar
        dest: "{{ jmxexporter_jar_url }}"

- name: Install Zookeeper Cluster
  import_playbook: confluent.platform.all
  when: lookup('env', 'MIGRATION')|default('false') == 'true'
