- name: Verify - kafka_connect plugin deployed (rootless)
  hosts: kafka_connect
  gather_facts: false
  tasks:
    - import_role:
        name: variables

    - name: List installed connect plugins under kafka_connect_confluent_hub_plugins_dest
      command: "ls {{ kafka_connect_confluent_hub_plugins_dest }}"
      register: hub_components
      changed_when: false

    - name: Assert the confluent-hub plugin was installed under rootless_deployment_path, not root
      assert:
        that:
          - kafka_connect_confluent_hub_plugins_dest is search(rootless_deployment_path)
          - "'jcustenborder-kafka-connect-spooldir' in hub_components.stdout"
        fail_msg: "Expected jcustenborder-kafka-connect-spooldir under {{ kafka_connect_confluent_hub_plugins_dest }}, found: {{ hub_components.stdout }}"
        quiet: true

- name: Verify log4j Configuration
  hosts: all,!kafka_controller_migration  #Workaround to skip the task in migration test, need to remove in CP 8.0
  gather_facts: false
  tasks:
    - import_role:
        name: confluent.test
        tasks_from: check_log4j.yml
