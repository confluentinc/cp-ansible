---
### Archive installation of Confluent Platform on Debian 10.
### SASL Protocol Plain.
### SSL Enabled.
### Kafka Connect Confluent Hub Plugins logic (Installs jcustenborder/kafka-connect-spooldir:2.0.43).
### Custom log dirs for all components.
###
### Runs Zookeeper by default, KRaft via `--env-file molecule/kraft.yml` (see docs/HOW_TO_TEST.md).
### Also covers rootless in place (rootless_enabled: true below); ZK<->KRaft migration coverage
### kept intact but not verified under rootless. See ROOTLESS_DEPLOYMENT_STEPS.md for why
### privileged: true here doesn't undermine the rootless proof.

platforms:
  - name: ${KRAFT_CONTROLLER:-zookeeper}1
    hostname: ${KRAFT_CONTROLLER:-zookeeper}1.confluent
    groups:
      - ${CONTROLLER_HOSTGROUP:-zookeeper}
      - ${CONTROLLER_HOSTGROUP:-zookeeper}_migration
    image: geerlingguy/docker-debian10-ansible
    dockerfile: ../Dockerfile-debian10-archive.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-broker1
    hostname: kafka-broker1.confluent
    groups:
      - kafka_broker
      - kafka_broker_migration
    image: geerlingguy/docker-debian10-ansible
    dockerfile: ../Dockerfile-debian10-archive.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: schema-registry1
    hostname: schema-registry1.confluent
    groups:
      - schema_registry
      - schema_registry_migration
    image: geerlingguy/docker-debian10-ansible
    dockerfile: ../Dockerfile-debian10-archive.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-rest1
    hostname: kafka-rest1.confluent
    groups:
      - kafka_rest
      - kafka_rest_migration
    image: geerlingguy/docker-debian10-ansible
    dockerfile: ../Dockerfile-debian10-archive.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-connect1
    hostname: kafka-connect1.confluent
    groups:
      - kafka_connect
      - kafka_connect_migration
    image: geerlingguy/docker-debian10-ansible
    dockerfile: ../Dockerfile-debian10-archive.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: ksql1
    hostname: ksql1.confluent
    groups:
      - ksql
      - ksql_migration
    image: geerlingguy/docker-debian10-ansible
    dockerfile: ../Dockerfile-debian10-archive.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: control-center1
    hostname: control-center1.confluent
    groups:
      - control_center
      - control_center_migration
    image: geerlingguy/docker-debian10-ansible
    dockerfile: ../Dockerfile-debian10-archive.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    published_ports:
      - "9021:9021"
    networks:
      - name: confluent
    # Cluster 2 (Kraft) goups, groupnames will be changed during converge phase
  - name: controller1-mig
    hostname: controller1-mig.confluent
    groups:
      - kafka_controller_migration
    image: geerlingguy/docker-debian10-ansible
    dockerfile: ../Dockerfile-debian10-archive.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
provisioner:
  playbooks:
    converge: converge.yml
    side_effect: side_effect.yml
  inventory:
    group_vars:
      all:
        sasl_protocol: plain
        ssl_enabled: true
        installation_method: "archive"
        kafka_connect_confluent_hub_plugins:
          - jcustenborder/kafka-connect-spooldir:2.0.43

        rootless_enabled: true
        deployment_user: cp-user
        deployment_group: cp-user
        rootless_deployment_path: /home/cp-user/cp-data
        rootless_install_packages: true
        ansible_user: "{{ deployment_user }}"

        # Dockerfile-debian10-archive.j2 pre-installs a JDK here at image build time.
        custom_java_path: /opt/jdk17

        ${CONTROLLER_HOSTGROUP:-zookeeper}_log_dir: "{{ rootless_deployment_path }}/logs/${CONTROLLER_HOSTGROUP:-zookeeper}"
        kafka_broker_log_dir: "{{ rootless_deployment_path }}/logs/kafka"
        schema_registry_log_dir: "{{ rootless_deployment_path }}/logs/sr"
        kafka_rest_log_dir: "{{ rootless_deployment_path }}/logs/rp"
        kafka_connect_log_dir: "{{ rootless_deployment_path }}/logs/connect"
        ksql_log_dir: "{{ rootless_deployment_path }}/logs/ksql"
        control_center_log_dir: "{{ rootless_deployment_path }}/logs/c3"
