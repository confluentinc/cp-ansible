---
# External Prometheus Basic auth: bundle absent, C3 reads the external Prometheus over TLS+Basic auth, alerts off,
# nodes pushing.
- import_playbook: ../external_prometheus_verify.yml
  when: external_prometheus_c3_supported | bool

# Validation: validate_external_prometheus rejects bad external configs (TLS off, both auth modes)
# and accepts the valid auth modes (TLS-only, TLS + Basic auth, mTLS).
- import_playbook: ../external_prometheus_validate.yml
  when: external_prometheus_c3_supported | bool
