---
### Validates Zookeeper sasl mechanism.
### Validates Kafka Broker and Schema Registry is set to SCRAM.

- name: Verify - zookeeper
  hosts: zookeeper
  gather_facts: false
  tasks:
    - import_role:
        name: confluent.test
        tasks_from: check_property.yml
      vars:
        file_path: /etc/kafka/zookeeper.properties
        property: authProvider.sasl
        expected_value: org.apache.zookeeper.server.auth.SASLAuthenticationProvider

- name: Verify - kafka_broker
  hosts: kafka_broker
  gather_facts: false
  tasks:
    - import_role:
        name: confluent.test
        tasks_from: check_property.yml
      vars:
        file_path: /etc/kafka/server.properties
        property: sasl.enabled.mechanisms
        expected_value: SCRAM-SHA-512

- name: Verify - schema_registry
  hosts: schema_registry
  gather_facts: false
  tasks:
    - import_role:
        name: confluent.test
        tasks_from: check_property.yml
      vars:
        file_path: /etc/schema-registry/schema-registry.properties
        property: kafkastore.security.protocol
        expected_value: SASL_PLAINTEXT

- name: Verify - keytabs were not copied by cp-ansible (kerberos_copy_keytab false)
  hosts: zookeeper,kafka_broker,schema_registry
  gather_facts: false
  tasks:
    - name: Stat keytab
      ansible.builtin.stat:
        path: "{{ item }}"
      register: keytab_stat
      loop: "{{ [zookeeper_keytab_path] if inventory_hostname in groups['zookeeper'] else ([kafka_broker_keytab_path] if inventory_hostname in groups['kafka_broker'] else [schema_registry_keytab_path]) }}"

    - name: Assert keytab still exists and is untouched (owned by root, not the service user)
      ansible.builtin.assert:
        that:
          - keytab_stat.results[0].stat.exists
          - keytab_stat.results[0].stat.pw_name == 'root'
