---
- name: Create keytab directory
  ansible.builtin.file:
    path: "{{ keytab_dest | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '755'

- name: Copy keytab (simulates external keytab management)
  ansible.builtin.copy:
    src: "{{ keytab_src }}"
    dest: "{{ keytab_dest }}"
    owner: root
    group: root
    mode: '644'
