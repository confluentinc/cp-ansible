---
### Provision the KDC and create principals/keytabs on the controller (same as ../kerberos.yml),
### then place the keytabs on the hosts ourselves to emulate externally-managed keytabs.
### The scenario sets kerberos_copy_keytab: false so cp-ansible must not copy them.
### Keytabs are placed as root:root so verify.yml can prove cp-ansible did not re-copy (and chown) them.
- import_playbook: ../kerberos.yml

- name: Place externally-managed keytabs - zookeeper
  hosts: zookeeper
  gather_facts: false
  tasks:
    - import_tasks: place_keytab.yml
      vars:
        keytab_src: "{{ zookeeper_kerberos_keytab_path }}"
        keytab_dest: "{{ zookeeper_keytab_path }}"

- name: Place externally-managed keytabs - kafka_broker
  hosts: kafka_broker
  gather_facts: false
  tasks:
    - import_tasks: place_keytab.yml
      vars:
        keytab_src: "{{ kafka_broker_kerberos_keytab_path }}"
        keytab_dest: "{{ kafka_broker_keytab_path }}"

- name: Place externally-managed keytabs - schema_registry
  hosts: schema_registry
  gather_facts: false
  tasks:
    - import_tasks: place_keytab.yml
      vars:
        keytab_src: "{{ schema_registry_kerberos_keytab_path }}"
        keytab_dest: "{{ schema_registry_keytab_path }}"
