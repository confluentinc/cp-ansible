---
# Exercises the stale-secret reconcile: drop a credential file for a cluster that
# is NOT declared in the inventory, then re-converge. The usm_agent role's cleanup
# must remove it; verify then asserts no orphaned secret files remain.
- name: Seed a stale command-handler secret file
  hosts: usm_agent
  gather_facts: false
  become: true
  tasks:
    # The secrets dir differs by install method, so resolve it like verify does:
    # active config from the unit's ExecStart, then the dir of a secret file it
    # references.
    - name: Read the command-handler systemd unit
      command: systemctl cat usm-agent-command-handler
      register: command_handler_unit
      changed_when: false

    - name: Read the active command-handler config
      slurp:
        path: "{{ command_handler_unit.stdout | regex_findall('-config-file\\s+(\\S+)') | last }}"
      register: command_handler_config_raw

    - name: Resolve the secrets dir from a referenced credential file
      set_fact:
        command_handler_secrets_dir: "{{ command_handler_config_raw.content | b64decode | regex_findall('auth\\.credential\\.file=(\\S+)') | first | dirname }}"

    - name: Write a credential file for an undeclared cluster
      copy:
        content: "ghost\nghost\n"
        dest: "{{ command_handler_secrets_dir }}/command-handler-ghost-credential.txt"
        mode: '600'

- name: Re-converge so the reconcile removes the stale secret
  import_playbook: ../collections_converge.yml
