---
### Installs Confluent Platform on Alma Linux 8.
### Enables MTLS Auth on Zookeeper.
### SASL SCRAM enabled on all components except Zookeeper.
### Customer zookeeper root.
### Secrets Protection enabled.

driver:
  name: docker
platforms:
  - name: zookeeper1
    hostname: zookeeper1.confluent
    groups:
      - zookeeper
    image: almalinux:8-minimal
    dockerfile: ../Dockerfile-rhel-java17.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
