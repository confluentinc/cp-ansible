---
### JMX exporter stale jar upgrade test (ANSIENG-5919).
### First converge installs the exporter the way older cp-ansible did: version 0.12.0 at the
### version-less jar path. Second converge runs with defaults and must replace the jar with the default version.
### Verify confirms the default version is running and exporting Kafka metrics.

driver:
  name: docker
platforms:
  - name: ${KRAFT_CONTROLLER:-zookeeper}1
    hostname: ${KRAFT_CONTROLLER:-zookeeper}1.confluent
    groups:
      - ${CONTROLLER_HOSTGROUP:-zookeeper}
    image: geerlingguy/docker-ubuntu2404-ansible
    dockerfile: ../Dockerfile-ubuntu-java25-lean.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-broker1
    hostname: kafka-broker1.confluent
    groups:
      - kafka_broker
    image: geerlingguy/docker-ubuntu2404-ansible
    dockerfile: ../Dockerfile-ubuntu-java25-lean.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-broker2
    hostname: kafka-broker2.confluent
    groups:
      - kafka_broker
    image: geerlingguy/docker-ubuntu2404-ansible
    dockerfile: ../Dockerfile-ubuntu-java25-lean.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-broker3
    hostname: kafka-broker3.confluent
    groups:
      - kafka_broker
    image: geerlingguy/docker-ubuntu2404-ansible
    dockerfile: ../Dockerfile-ubuntu-java25-lean.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
provisioner:
  playbooks:
    converge: converge.yml
  inventory:
    group_vars:
      all:
        # Archive (local tarball) installation. Tarballs are staged into the
        # scenario directory on the control node by cp-ansible-tools; remote:false
        # copies them into each container and expands at archive_destination_path.
        installation_method: archive
        confluent_archive_file_source: "{{ lookup('env', 'MOLECULE_SCENARIO_DIRECTORY') }}/confluent{{ '' if confluent_server_enabled else '-community' }}-{{ confluent_package_version }}.tar.gz"
        confluent_archive_file_remote: false
        confluent_archive_control_center_next_gen_file_source: "{{ lookup('env', 'MOLECULE_SCENARIO_DIRECTORY') }}/confluent-control-center-next-gen-{{ confluent_control_center_next_gen_package_version }}.tar.gz"
        confluent_archive_control_center_next_gen_file_remote: false
        confluent_archive_usm_agent_file_source: "{{ lookup('env', 'MOLECULE_SCENARIO_DIRECTORY') }}/confluent-usm-agent-{{ confluent_usm_agent_full_package_version }}.tar.gz"
        confluent_archive_usm_agent_file_remote: false
        scenario_name: jmx-exporter-stale-jar-upgrade
        jmxexporter_enabled: true
