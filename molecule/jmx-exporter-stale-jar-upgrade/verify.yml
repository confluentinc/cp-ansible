---
- name: Verify - kafka_broker
  hosts: kafka_broker
  gather_facts: false
  tasks:
    - name: Get jmxexporter metrics
      uri:
        url: "http://{{inventory_hostname}}:8080/metrics"
        return_content: true
      register: jmxexporter_metrics
      until: jmxexporter_metrics.content is search('kafka_server_replicamanager_partitioncount')
      retries: 10
      delay: 10

    - name: Assert jmxexporter 1.6.0 agent is running and exporting Kafka metrics
      assert:
        that:
          - jmxexporter_metrics.content is search('jmx_exporter_build_info\\{.*version="1\\.6\\.0"')
          - jmxexporter_metrics.content is search('kafka_server_replicamanager_partitioncount')
        quiet: true

- name: Verify - kafka_controller
  hosts: kafka_controller
  gather_facts: false
  tasks:
    - name: Get jmxexporter metrics
      uri:
        url: "http://{{inventory_hostname}}:8079/metrics"
        return_content: true
      register: jmxexporter_metrics
      until: jmxexporter_metrics.content is search('kafka_controller_kafkacontroller_activecontrollercount')
      retries: 10
      delay: 10

    - name: Assert jmxexporter 1.6.0 agent is running and exporting Kafka metrics
      assert:
        that:
          - jmxexporter_metrics.content is search('jmx_exporter_build_info\\{.*version="1\\.6\\.0"')
          - jmxexporter_metrics.content is search('kafka_controller_kafkacontroller_activecontrollercount')
        quiet: true
