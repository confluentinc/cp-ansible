---
# Scenario 2 — PURE_DUAL_WRITE → hybrid (the hard one).
#
# deploy (prepare) → forward to HYBRID_DUAL_WRITE → push brokers to
# PURE_DUAL_WRITE → partial rollback to hybrid.
#
# All --tags-dependent steps (forward migrate, push to PURE_DUAL_WRITE,
# rollback) run the real entry playbooks as tagged sub-runs, because
# import_playbook applies tags additively and cannot scope execution to a tag
# subset.

- name: Promote controllers and migrate forward to HYBRID_DUAL_WRITE
  hosts: localhost
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir }}/../.."
    molecule_inventory: "{{ lookup('env', 'MOLECULE_INVENTORY_FILE') }}"
    # The nested ansible-playbook sub-runs below start fresh and do NOT inherit
    # the extra-vars / skip-tags this converge run was invoked with. The on-demand
    # (Semaphore) pipeline passes confluent_package_version etc. as extra-vars and,
    # for nightly migration builds, --skip-tags check_confluent_package_version.
    # Rebuild those from this run's own vars/tags and forward them, otherwise the
    # sub-runs fall back to role defaults and the version gate fails.
    _forward_var_names:
      - confluent_package_version
      - confluent_full_package_version
      - confluent_common_repository_baseurl
      - confluent_package_redhat_suffix
      - confluent_package_debian_suffix
    migration_forward_args: "{% for k in _forward_var_names %}{% set v = lookup('vars', k, default='') %}{% if v != '' %}-e {{ k }}='{{ v }}' {% endif %}{% endfor %}{% if ansible_skip_tags | default([]) %}--skip-tags {{ (ansible_skip_tags | default([])) | join(',') }}{% endif %}"
  tasks:
    # Promote the migration-held controllers into the live kafka_controller
    # group so the tagged sub-runs (which read the inventory file fresh) see them.
    - name: Promote kafka_controller_migration → kafka_controller
      lineinfile:
        path: "{{ molecule_inventory }}"
        regexp: "kafka_controller_migration:"
        line: "kafka_controller:"

    - name: Forward-migrate to HYBRID_DUAL_WRITE (--tags migrate_to_dual_write)
      command: >-
        ansible-playbook
        -i {{ molecule_inventory }}
        {{ repo_root }}/playbooks/ZKtoKraftMigration.yml
        --tags migrate_to_dual_write
        -e kraft_migration=true
        {{ migration_forward_args }}
      args:
        chdir: "{{ repo_root }}"
      changed_when: true
      register: forward_migrate

    - name: Show forward-migration output
      debug:
        var: forward_migrate.stdout_lines

    - name: Push brokers to PURE_DUAL_WRITE (--tags migrate_to_pure_dual_write)
      command: >-
        ansible-playbook
        -i {{ molecule_inventory }}
        {{ repo_root }}/playbooks/ZKtoKraftMigration.yml
        --tags migrate_to_pure_dual_write
        -e kraft_migration=true
        {{ migration_forward_args }}
      args:
        chdir: "{{ repo_root }}"
      changed_when: true
      register: pure_dual_write_migrate

    - name: Show PURE_DUAL_WRITE migration output
      debug:
        var: pure_dual_write_migrate.stdout_lines

# Confirms --tags migrate_to_pure_dual_write actually lands the cluster in
# PURE_DUAL_WRITE (reusing the same detection logic KRaftToZKRollback.yml's
# pre-rollback checks rely on), before we roll it back.
- name: Verify migrate_to_pure_dual_write reached PURE_DUAL_WRITE
  hosts: localhost
  gather_facts: true  # detection resolves kafka_broker.config_file, which needs ansible_os_family
  vars:
    repo_root: "{{ playbook_dir }}/../.."
  tasks:
    - import_role:
        name: variables

    - include_tasks: "{{ repo_root }}/playbooks/tasks/detect_migration_phase.yml"

    - name: Assert cluster reached PURE_DUAL_WRITE
      assert:
        that:
          - migration_state == "PURE_DUAL_WRITE"
        fail_msg: >-
          Expected PURE_DUAL_WRITE after --tags migrate_to_pure_dual_write,
          got {{ migration_state }}.
        success_msg: "Cluster is in PURE_DUAL_WRITE as expected"

- name: Partial rollback to hybrid
  hosts: localhost
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir }}/../.."
    molecule_inventory: "{{ lookup('env', 'MOLECULE_INVENTORY_FILE') }}"
    # The nested ansible-playbook sub-runs below start fresh and do NOT inherit
    # the extra-vars / skip-tags this converge run was invoked with. The on-demand
    # (Semaphore) pipeline passes confluent_package_version etc. as extra-vars and,
    # for nightly migration builds, --skip-tags check_confluent_package_version.
    # Rebuild those from this run's own vars/tags and forward them, otherwise the
    # sub-runs fall back to role defaults and the version gate fails.
    _forward_var_names:
      - confluent_package_version
      - confluent_full_package_version
      - confluent_common_repository_baseurl
      - confluent_package_redhat_suffix
      - confluent_package_debian_suffix
    migration_forward_args: "{% for k in _forward_var_names %}{% set v = lookup('vars', k, default='') %}{% if v != '' %}-e {{ k }}='{{ v }}' {% endif %}{% endfor %}{% if ansible_skip_tags | default([]) %}--skip-tags {{ (ansible_skip_tags | default([])) | join(',') }}{% endif %}"
  tasks:
    # Real rollback with its health checks. The post-rollback controller
    # metadata-quorum probe is correctly skipped on community kafka by
    # KRaftToZKRollback.yml's confluent_server_enabled guard, so nothing to skip
    # here. verify.yml asserts the hybrid end state.
    - name: Partial rollback to hybrid (--tags rollback_to_hybrid)
      command: >-
        ansible-playbook
        -i {{ molecule_inventory }}
        {{ repo_root }}/playbooks/KRaftToZKRollback.yml
        --tags rollback_to_hybrid
        -e kraft_migration=true
        {{ migration_forward_args }}
      args:
        chdir: "{{ repo_root }}"
      changed_when: true
      register: rollback_run

    - name: Show rollback output
      debug:
        var: rollback_run.stdout_lines
