---
- name: Verify USM Agent Functionality
  hosts: usm_agent
  gather_facts: true
  vars:
    # USM Agent configuration
    usm_agent_host: "{{ inventory_hostname }}"
    usm_agent_controlplane_port: 9999
    usm_agent_log_file: "/var/log/confluent/usm-agent/usm-agent_access.log"

    # CCloud Mock Service configuration
    ccloud_mock_host: "ccloud-mock-service"
    ccloud_mock_port: 8081
    ccloud_mock_user: "ccloud-user"
    ccloud_mock_password: "ccloud-secret"

  tasks:
    # USM Agent Health Check
    - name: Check USM Agent health
      uri:
        url: "http://{{ usm_agent_host }}:{{ usm_agent_controlplane_port }}/healthz"
        method: GET
        status_code: 200
        timeout: 10
      register: usm_healthz_check
      retries: 5
      delay: 10
      until: usm_healthz_check.status == 200

    # Get baseline events count
    - name: Get baseline events count
      uri:
        url: "http://{{ ccloud_mock_host }}:{{ ccloud_mock_port }}/events_count"
        method: GET
        user: "{{ ccloud_mock_user }}"
        password: "{{ ccloud_mock_password }}"
        force_basic_auth: true
        status_code: 200
        timeout: 10
      register: baseline_events_count

    # Check USM Agent logs
    - name: Check USM Agent access logs
      stat:
        path: "{{ usm_agent_log_file }}"
      register: log_file_stat

    - name: Search for v1/events endpoint in logs (204)
      shell: "grep -c 'POST.*v1/events.*204' {{ usm_agent_log_file }} || true"
      register: events_grep_result
      when: log_file_stat.stat.exists

    - name: Search for v1/metrics endpoint in logs (200)
      shell: "grep -c 'POST.*v1/metrics.*200' {{ usm_agent_log_file }} || true"
      register: metrics_grep_result
      when: log_file_stat.stat.exists

    - name: Set events endpoint found fact
      set_fact:
        events_endpoint_found: "{{ (events_grep_result.stdout | int) > 0 }}"
      when: log_file_stat.stat.exists

    - name: Set metrics endpoint found fact
      set_fact:
        metrics_endpoint_found: "{{ (metrics_grep_result.stdout | int) > 0 }}"
      when: log_file_stat.stat.exists

    # Verification assertions
    - name: Assert USM Agent log file exists
      assert:
        that:
          - log_file_stat.stat.exists
        fail_msg: "USM Agent access log file does not exist at {{ usm_agent_log_file }}"

    - name: Assert v1/events endpoint is working
      assert:
        that:
          - events_endpoint_found | default(false)
        fail_msg: "USM Agent v1/events endpoint not found in logs or not returning 204 status"
      when: log_file_stat.stat.exists

    - name: Assert v1/metrics endpoint is working
      assert:
        that:
          - metrics_endpoint_found | default(false)
        fail_msg: "USM Agent v1/metrics endpoint not found in logs or not returning 200 status"
      when: log_file_stat.stat.exists

    # The Command Handler is verified from BOX STATE (the rendered config on the
    # host), not from scenario inventory vars: molecule verify does not load the
    # scenario's provisioner.inventory host_vars/group_vars. When the config is
    # absent the CH was not configured for this scenario, so these checks no-op.
    # The config and secrets paths differ by install method (package -> /etc,
    # archive -> under the versioned archive dir), so resolve them from the
    # service's own systemd unit (-config-file) rather than hard-coding /etc.
    # The package always ships the unit and a default config, so only the role
    # enabling the service marks the Command Handler as configured.
    - name: Check whether the command-handler service is enabled
      command: systemctl is-enabled usm-agent-command-handler
      register: command_handler_is_enabled
      changed_when: false
      failed_when: false

    - name: Read the command-handler systemd unit
      command: systemctl cat usm-agent-command-handler
      register: command_handler_unit
      changed_when: false
      failed_when: false

    # Take the LAST -config-file: archive installs add an ExecStart override
    # (pointing under the archive dir) that supersedes the base unit's /etc path.
    # Empty when the service is not enabled (non-CH scenarios), so the checks
    # below no-op.
    - name: Resolve the active config path from the unit's ExecStart
      set_fact:
        command_handler_config_path: >-
          {{ (command_handler_unit.stdout | default('') | regex_findall('-config-file\s+(\S+)') | last)
             if (command_handler_is_enabled.stdout | default('') == 'enabled'
                 and (command_handler_unit.stdout | default('') | regex_findall('-config-file\s+(\S+)')) | length > 0)
             else '' }}

    - name: Stat command-handler config
      stat:
        path: "{{ command_handler_config_path }}"
      register: command_handler_config_stat
      when: command_handler_config_path | length > 0

    - name: Assert command-handler config exists
      assert:
        that: command_handler_config_stat.stat.exists
        fail_msg: "command-handler config not found at {{ command_handler_config_path }}"
      when: command_handler_config_path | length > 0

    - name: Read command-handler config
      slurp:
        path: "{{ command_handler_config_path }}"
      register: command_handler_config_raw
      when: command_handler_config_path | length > 0

    - name: Assert command-handler service is active
      command: systemctl is-active usm-agent-command-handler
      register: command_handler_is_active
      changed_when: false
      failed_when: command_handler_is_active.stdout != 'active'
      when: command_handler_config_path | length > 0

    - name: Probe command-handler /healthz (liveness)
      uri:
        url: "http://localhost:{{ usm_agent_command_handler_monitoring_port | default(9930) }}/healthz"
        status_code: 200
        timeout: 5
      register: command_handler_healthz
      until: command_handler_healthz.status == 200
      retries: 5
      delay: 3
      when: command_handler_config_path | length > 0

    - name: Search the agent access log for a successful hybrid-commands poll (200)
      shell: "grep -cE 'GET.*hybrid-commands.*200' {{ usm_agent_log_file }} || true"
      register: hybrid_commands_grep_result
      until: (hybrid_commands_grep_result.stdout | int) > 0
      retries: 10
      delay: 6
      failed_when: false
      when: command_handler_config_path | length > 0

    - name: Assert the Command Handler completed a Cloud poll (hybrid-commands 200)
      assert:
        that:
          - (hybrid_commands_grep_result.stdout | int) > 0
        fail_msg: >-
          No successful GET /v1/hybrid-commands (200) in the agent access log
          ({{ usm_agent_log_file }}) -- the Command Handler never completed a Cloud
          poll against the mock's hybrid endpoint.
        success_msg: "Command Handler completed a hybrid-commands poll against Cloud (mock)"
      when: command_handler_config_path | length > 0

    # The role writes secrets under usm_agent_secrets_dir, which for archive
    # installs is not next to the config, so take the dir from a secret file the
    # config references. Fall back to <config dir>/secrets when none is referenced.
    - name: Derive managed cluster names + secrets dir from box state
      vars:
        command_handler_ref_paths: "{{ command_handler_config_raw.content | b64decode | regex_findall('(?:tls\\.trusted\\.ca\\.file|auth\\.credential\\.file)=(\\S+)') }}"
      set_fact:
        command_handler_config: "{{ command_handler_config_raw.content | b64decode }}"
        command_handler_clusters: "{{ command_handler_config_raw.content | b64decode | regex_findall('connect\\.clusters\\.([A-Za-z0-9_-]+)\\.url=') | unique }}"
        command_handler_secrets_dir: "{{ (command_handler_ref_paths | first | dirname) if command_handler_ref_paths | length > 0 else (command_handler_config_path | dirname ~ '/secrets') }}"
      when: command_handler_config_path | length > 0

    - name: Assert at least one managed cluster is rendered
      assert:
        that: command_handler_clusters | length > 0
        fail_msg: "no managed Connect clusters rendered in command-handler.properties"
      when: command_handler_config_path | length > 0

    - name: Assert each cluster renders url + group.id
      vars:
        prefix: "confluent.usm-agent.command-handler.connect.clusters.{{ item }}"
      assert:
        that:
          - (prefix ~ '.url=') in command_handler_config
          - (prefix ~ '.group.id=') in command_handler_config
        fail_msg: "cluster '{{ item }}' missing url/group.id in command-handler.properties"
      loop: "{{ command_handler_clusters | default([]) }}"

    - name: Stat every CA / credential file referenced by the config
      stat:
        path: "{{ item }}"
      register: command_handler_ref_files
      loop: "{{ (command_handler_config | default('') | regex_findall('(?:tls\\.trusted\\.ca\\.file|auth\\.credential\\.file)=(\\S+)')) | default([]) }}"
      when: command_handler_config_path | length > 0

    - name: Assert referenced CA / credential files exist
      assert:
        that: item.stat.exists
        fail_msg: "referenced command-handler file missing: {{ item.item }}"
      loop: "{{ command_handler_ref_files.results | default([]) | rejectattr('skipped', 'defined') | list }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Stat would-be CA files for OS-trust clusters (https, no trusted CA line)
      stat:
        path: "{{ command_handler_secrets_dir }}/command-handler-{{ item }}-ca.crt"
      register: command_handler_ostrust_ca
      loop: "{{ command_handler_clusters | default([]) }}"
      when:
        - command_handler_config_path | length > 0
        - ('confluent.usm-agent.command-handler.connect.clusters.' ~ item ~ '.url=https://') in command_handler_config
        - ('confluent.usm-agent.command-handler.connect.clusters.' ~ item ~ '.tls.trusted.ca.file=') not in command_handler_config

    - name: Assert no CA file is copied for OS-trust clusters
      assert:
        that: not item.stat.exists
        fail_msg: "OS-trust cluster '{{ item.item }}' unexpectedly has a CA file"
      loop: "{{ command_handler_ostrust_ca.results | default([]) | rejectattr('skipped', 'defined') | list }}"
      loop_control:
        label: "{{ item.item }}"

    # Every command-handler secret file on disk must map to a currently-managed
    # cluster. Catches secrets left behind for removed/renamed/downgraded clusters
    # (the side_effect seeds one for an undeclared cluster to exercise the reconcile).
    - name: List command-handler secret files on disk
      find:
        paths: "{{ command_handler_secrets_dir }}"
        patterns:
          - "command-handler-*-credential.txt"
          - "command-handler-*-ca.crt"
      register: command_handler_secret_files_on_disk
      when: command_handler_config_path | length > 0

    - name: Assert no orphaned command-handler secret files remain
      assert:
        that:
          - (item.path | basename | regex_replace('^command-handler-', '') | regex_replace('-(credential\.txt|ca\.crt)$', '')) in command_handler_clusters
        fail_msg: "orphaned command-handler secret file '{{ item.path | basename }}' has no matching managed cluster"
      loop: "{{ command_handler_secret_files_on_disk.files | default([]) }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: command_handler_config_path | length > 0

    - name: Wait for the Command Handler to resolve a Connect cluster (/statusz)
      uri:
        url: "http://127.0.0.1:{{ command_handler_config | regex_findall('command-handler\\.admin\\.port=(\\d+)') | first | default('9920') }}/statusz"
        return_content: true
        status_code: 200
        timeout: 5
      register: command_handler_statusz
      until: (command_handler_statusz.json.clusters | default([]) | selectattr('resolved') | list | length) > 0
      retries: 36
      delay: 5
      when: command_handler_config_path | length > 0

    - name: Set the resolved Connect clusters and the round trip command id
      set_fact:
        command_handler_resolved_clusters: "{{ command_handler_statusz.json.clusters | selectattr('resolved') | list }}"
        command_handler_command_id_prefix: "molecule-{{ inventory_hostname }}-{{ now(utc=true).strftime('%s') }}"
      when: command_handler_config_path | length > 0

    - name: Queue a GET / command on the ccloud mock for each resolved cluster
      uri:
        url: "http://{{ ccloud_mock_host }}:{{ ccloud_mock_port }}/hybrid_commands"
        method: POST
        user: "{{ ccloud_mock_user }}"
        password: "{{ ccloud_mock_password }}"
        force_basic_auth: true
        body_format: json
        body:
          kafka_cluster_id: "{{ item.kafkaClusterId }}"
          connect_group_id: "{{ item.connectGroupId }}"
          connector_name: molecule-ch-verify
          commands:
            - command_id: "{{ command_handler_command_id_prefix }}-{{ item.name }}"
              command:
                method: GET
                path: /
        status_code: 201
        timeout: 10
      register: command_handler_queued
      until: command_handler_queued.status == 201
      retries: 5
      delay: 5
      loop: "{{ command_handler_resolved_clusters | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when: command_handler_config_path | length > 0

    - name: Wait for the Command Handler to report each command status to the ccloud mock
      uri:
        url: "http://{{ ccloud_mock_host }}:{{ ccloud_mock_port }}/hybrid_commands_status?command_id={{ command_handler_command_id_prefix }}-{{ item.name }}"
        user: "{{ ccloud_mock_user }}"
        password: "{{ ccloud_mock_password }}"
        force_basic_auth: true
        return_content: true
        status_code: 200
        timeout: 10
      register: command_handler_command_statuses
      until: command_handler_command_statuses.status == 200
      retries: 36
      delay: 5
      loop: "{{ command_handler_resolved_clusters | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when: command_handler_config_path | length > 0

    - name: Assert each command executed on Connect and returned its Kafka cluster id
      assert:
        that:
          - item.json.phase == 'EXECUTED'
          - item.json.detail.http_status == 200
          - (item.json.detail.message | from_json).kafka_cluster_id == item.item.kafkaClusterId
        fail_msg: "cluster '{{ item.item.name }}': unexpected command status {{ item.json | default(item.content) }}"
        success_msg: "cluster '{{ item.item.name }}': GET / executed on Connect and reported back through the agent"
      loop: "{{ command_handler_command_statuses.results | default([]) | rejectattr('skipped', 'defined') | list }}"
      loop_control:
        label: "{{ item.item.name }}"

- name: Verify USM HTTP Exporter Configs - Kafka Controller
  hosts: kafka_controller
  gather_facts: false
  tasks:
    - name: Import variables role
      import_role:
        name: variables

    - name: Verify USM buffer.batch.items.max (Controller)
      import_role:
        name: confluent.test
        tasks_from: check_property.yml
      vars:
        file_path: "{{ (config_base_path, kafka_controller_config_prefix_path, 'server.properties') | path_join }}"
        property: confluent.telemetry.exporter._usm.buffer.batch.items.max
        expected_value: "4000"

    - name: Verify USM buffer.inflight.submissions.max (Controller)
      import_role:
        name: confluent.test
        tasks_from: check_property.yml
      vars:
        file_path: "{{ (config_base_path, kafka_controller_config_prefix_path, 'server.properties') | path_join }}"
        property: confluent.telemetry.exporter._usm.buffer.inflight.submissions.max
        expected_value: "10"

    - name: Verify USM buffer.pending.batches.max (Controller)
      import_role:
        name: confluent.test
        tasks_from: check_property.yml
      vars:
        file_path: "{{ (config_base_path, kafka_controller_config_prefix_path, 'server.properties') | path_join }}"
        property: confluent.telemetry.exporter._usm.buffer.pending.batches.max
        expected_value: "80"

