---
### Installs Confluent Platform with a dynamic KRaft controller quorum on RHEL.
### Secrets protection enabled.
### Loses the controller quorum and recovers it with the KRaftQuorumRecovery playbook.

driver:
  name: docker
platforms:
  - name: controller1
    hostname: controller1.confluent
    groups:
      - kafka_controller
    image: redhat/ubi10-minimal
    dockerfile: ../Dockerfile-rhel-java25.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: controller2
    hostname: controller2.confluent
    groups:
      - kafka_controller
    image: redhat/ubi10-minimal
    dockerfile: ../Dockerfile-rhel-java25.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: controller3
    hostname: controller3.confluent
    groups:
      - kafka_controller
    image: redhat/ubi10-minimal
    dockerfile: ../Dockerfile-rhel-java25.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-broker1
    hostname: kafka-broker1.confluent
    groups:
      - kafka_broker
    image: redhat/ubi10-minimal
    dockerfile: ../Dockerfile-rhel-java25.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
  - name: kafka-broker2
    hostname: kafka-broker2.confluent
    groups:
      - kafka_broker
    image: redhat/ubi10-minimal
    dockerfile: ../Dockerfile-rhel-java25.j2
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    networks:
      - name: confluent
provisioner:
  playbooks:
    converge: converge.yml
  inventory:
    group_vars:
      all:
        kraft_dynamic_quorum_enabled: true
        kafka_controller_initial_voter: "{{ groups.kafka_controller[0] }}"
        secrets_protection_enabled: true

        kraft_quorum_recovery_failed_hosts:
          - controller2
        kraft_quorum_recovery_confirmed: true
